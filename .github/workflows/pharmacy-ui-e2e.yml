name: pharmacy-ui-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pharmacy-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build single HTML
        run: python build.py

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Pharmacy UI click path
        run: node tests/pharmacy-ui-e2e.js
