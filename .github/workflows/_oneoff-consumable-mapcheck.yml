name: oneoff-consumable-mapcheck

on:
  push:
    branches:
      - fix/pre-re-consumable-weights
    paths:
      - '.github/workflows/_oneoff-consumable-mapcheck.yml'

permissions:
  contents: write

jobs:
  mapcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-re-consumable-weights
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch rAthena pre-re DB
        run: |
          mkdir -p /tmp/rathena-pre-re
          for f in usable etc equip; do curl -fsSL https://raw.githubusercontent.com/rathena/rathena/master/db/pre-re/item_db_${f}.yml -o /tmp/rathena-pre-re/item_db_${f}.yml; done
          pip install --quiet pyyaml
      - name: Validate mappings
        run: |
          cat > /tmp/mapcheck.py <<'PY'
          import yaml, pathlib
          files=['item_db_usable.yml','item_db_etc.yml','item_db_equip.yml']
          src={}
          for fn in files:
              data=yaml.safe_load((pathlib.Path('/tmp/rathena-pre-re')/fn).read_text()) or {}
              for r in data.get('Body',[]):
                  if r.get('AegisName'): src[r['AegisName']]=r
          M={
          '각성의 포션':'Awakening_Potion','강철의 화살':'Steel_Arrow','강철의 화살통':'Steel_Arrow_Container',
          '고기':'Meat','고목나무 가지':'Branch_Of_Dead_Tree','그림자의 화살':'Arrow_Of_Shadow','그림자화살통':'Shadow_Arrow_Container',
          '꿀':'Honey','나비의 날개':'Wing_Of_Butterfly','날카로운 화살':'Sharp_Arrow','낡은 카드첩':'Old_Card_Album',
          '노란포션':'Yellow_Potion','녹슨 화살':'Rusty_Arrow','녹슨 화살통':'Rusty_Arrow_Container','독화살':'Poison_Arrow',
          '딸기':'Strawberry','마스텔라의 열매':'Fruit_Of_Mastela','몬스터 사료':"Monster's_Feed",'무형의 화살':'Immatrial_Arrow',
          '무형의 화살통':'Imma_Arrow_Container','바람 화살통':'Wind_Arrow_Container','바람의 화살':'Arrow_Of_Wind',
          '불화살':'Fire_Arrow','불화살통':'Fire_Arrow_Container','빨간 허브':'Red_Herb','빨간포션':'Red_Potion','사과':'Apple',
          '사일런스 애로우':'Silence_Arrow','사탕':'Candy','선물상자':'Gift_Box','성수':'Holy_Water','성스러운 화살':'Holy_Arrow',
          '성스러운 화살통':'Holy_Arrow_Container','수정 화살':'Crystal_Arrow','수정 화살통':'Crystal_Arrow_Container',
          '스턴 애로우':'Stun_Arrow','슬립 애로우':'Sleep_Arrow','암석 화살':'Stone_Arrow','암석 화살통':'Stone_Arrow_Container',
          '옐로 허브':'Yellow_Herb','오래된보라상자':'Old_Violet_Box','오래된빨간상자':'Old_Red_Box','오래된파란상자':'Old_Blue_Box',
          '오렌지':'Orange','오리데오콘 화살':'Oridecon_Arrow','오리데오콘 화살통':'Ori_Arrow_Container','웰스쿠키':'Well_Baked_Cookie',
          '은화살':'Silver_Arrow','은화살통':'Silver_Arrow_Container','조각케이크':'Piece_Of_Cake','주홍포션':'Orange_Potion',
          '철 화살':'Iron_Arrow','철 화살통':'Iron_Arrow_Container','초록포션':'Green_Potion','초록허브':'Green_Herb',
          '캔디 스트라이퍼':'Candy_Striper','커스 애로우':'Curse_Arrow','파란포션':'Blue_Potion','파란허브':'Blue_Herb',
          '파리의 날개':'Wing_Of_Fly','파마의 화살':'Arrow_Of_Counter_Evil','프리징 애로우':'Freezing_Arrow','플래쉬 애로우':'Flash_Arrow',
          '하얀포션':'White_Potion','하얀허브':'White_Herb','화살':'Arrow','화살통':'Arrow_Container'
          }
          lines=['# 한국어 소모품 Aegis 매핑 검증','','| TextRAG | 후보 Aegis | 존재 | rAthena ID | 원작명 | 원작 무게→TextRAG |','|---|---|---|---:|---|---:|']
          missing=[]
          for k,a in M.items():
              r=src.get(a)
              if not r:
                  missing.append((k,a)); lines.append(f'| {k} | `{a}` | **없음** | - | - | - |')
              else:
                  w=(r.get('Weight',0) or 0)/10
                  if float(w).is_integer(): w=int(w)
                  lines.append(f'| {k} | `{a}` | 확인 | {r.get("Id")} | {r.get("Name")} | {w} |')
          lines += ['',f'- 확인: **{len(M)-len(missing)} / {len(M)}**',f'- 미확인: **{len(missing)}**','']
          if missing:
              lines += ['## 미확인 후보','']+[f'- `{k}` → `{a}`' for k,a in missing]
          pathlib.Path('CONSUMABLE_AEGIS_MAPCHECK.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('missing=',missing)
          PY
          python /tmp/mapcheck.py
      - name: Commit mapping report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONSUMABLE_AEGIS_MAPCHECK.md
          git commit -m "audit: validate consumable Aegis mappings"
          git push origin HEAD:fix/pre-re-consumable-weights
