name: doll-patch-temp

on:
  push:
    branches:
      - feat/alberta-doll-quest

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alberta-doll-quest
      - name: Replace invented NPC with original Alberta doll exchange
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/data/db-npcs.json')
          b=p.read_bytes()
          old='  "울고 있는 소녀": {"map": "미궁 숲", "emoji": "😢", "dialog": "흑흑... 바포메트라는 무서운 괴물이 제 인형을 빼앗아 갔어요...", "service": ""},'.encode('utf-8')
          new=('  "꼬마아이": {"map": "알베르타", "emoji": "👧", "dialog": "인형을 모으고 있어요! 인형 하나를 가져다주면 사탕이나 막대사탕과 바꿔 드릴게요.", "service": "exchange", "exchanges": ['
               '{"label": "촌촌 인형 1개 → 사탕/막대사탕", "give": {"촌촌 인형": 1}, "random": {"pool": ["사탕", "캔디 스트라이퍼"], "rolls": 1}}, '
               '{"label": "메뚜기 인형 1개 → 사탕/막대사탕", "give": {"메뚜기 인형": 1}, "random": {"pool": ["사탕", "캔디 스트라이퍼"], "rolls": 1}}, '
               '{"label": "스포아 인형 1개 → 사탕/막대사탕", "give": {"스포아 인형": 1}, "random": {"pool": ["사탕", "캔디 스트라이퍼"], "rolls": 1}}, '
               '{"label": "바포메트 인형 1개 → 사탕/막대사탕", "give": {"바포메트 인형": 1}, "random": {"pool": ["사탕", "캔디 스트라이퍼"], "rolls": 1}}, '
               '{"label": "너구리 인형 1개 → 사탕/막대사탕", "give": {"너구리 인형": 1}, "random": {"pool": ["사탕", "캔디 스트라이퍼"], "rolls": 1}}, '
               '{"label": "몽키 인형 1개 → 사탕/막대사탕", "give": {"몽키 인형": 1}, "random": {"pool": ["사탕", "캔디 스트라이퍼"], "rolls": 1}}]},').encode('utf-8')
          if old in b:
              if b.count(old) != 1:
                  raise SystemExit(f'expected one invented NPC row, got {b.count(old)}')
              p.write_bytes(b.replace(old,new,1))
              print('patched')
          elif new in b:
              print('already patched')
          else:
              raise SystemExit('neither old nor new NPC row found')
          PY
      - name: Validate data and build
        run: |
          node tests/alberta-doll-exchange-smoke.js
          python build.py
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No data patch needed.'
            exit 0
          fi
          git config user.name 'Da Bimci'
          git config user.email '284856624+J-Roc-H@users.noreply.github.com'
          git add source/data/db-npcs.json
          git commit -m 'fix(npc): replace invented Baphomet girl with Alberta doll exchange'
          git push origin HEAD:feat/alberta-doll-quest
