name: oneoff-rebase-pr9

on:
  push:
    branches: [fix/quest-item-sources-rebase]
    paths: ['.github/workflows/_oneoff-rebase-pr9.yml']

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quest-item-sources-rebase
          fetch-depth: 0
      - name: Reapply quest item source patch on latest main
        run: |
          git fetch origin fix/quest-item-sources
          for f in \
            source/data/db-items.json \
            source/data/db-monsters.json \
            source/data/db-npcs.json \
            source/quest-guide.js \
            source/services.js \
            source/template.html
          do
            git show origin/fix/quest-item-sources:"$f" > "$f"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('build.py')
          s=p.read_text(encoding='utf-8')
          if '\nimport re\n' not in s:
              s=s.replace('import os\n','import os\nimport re\n',1)
          if 'def audit_quest_item_sources(' not in s:
              marker='\ndef load_data_files():'
              func='''\n\ndef audit_quest_item_sources(template, parsed):\n    \"\"\"Fail the build when a gather quest has no real acquisition route.\"\"\"\n    targets = set(re.findall(r\"type\\s*:\\s*['\\\"]gather['\\\"][\\s\\S]{0,220}?target\\s*:\\s*['\\\"]([^'\\\"]+)['\\\"]\", template))\n    for block in re.finditer(r\"type\\s*:\\s*['\\\"]gather_multi['\\\"][\\s\\S]{0,900}?targets\\s*:\\s*\\[([\\s\\S]{0,800}?)\\]\", template):\n        targets.update(re.findall(r\"item\\s*:\\s*['\\\"]([^'\\\"]+)['\\\"]\", block.group(1)))\n    quest_only = set()\n    for m in re.finditer(r\"item\\s*:\\s*['\\\"]([^'\\\"]+)['\\\"][\\s\\S]{0,180}?questSource\\s*:\\s*\\{\", template):\n        quest_only.add(m.group(1))\n    drops = {name for mon in parsed['DB_MONSTERS'].values() for name in (mon.get('drops') or {})}\n    sells = {name for npc in parsed['DB_NPCS'].values() for name in (npc.get('sells') or [])}\n    missing = sorted(targets - drops - sells - quest_only)\n    if missing:\n        raise ValueError('획득처 없는 퀘스트 아이템: ' + ', '.join(missing))\n    print(f\"OK - quest item source audit ({len(targets)} gather target(s))\")\n'''
              assert marker in s
              s=s.replace(marker,func+marker,1)
          call='    raw, parsed = load_data_files()\n'
          if '    audit_quest_item_sources(template, parsed)\n' not in s:
              assert call in s
              s=s.replace(call,call+'    audit_quest_item_sources(template, parsed)\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check source/quest-guide.js
          node --check source/actor-interaction.js
          node tests/actor-interaction-smoke.js
          python -m py_compile build.py
          python build.py | tee /tmp/build.log
          grep -q 'OK - quest item source audit (36 gather target(s))' /tmp/build.log
          grep -q 'OK - actor interaction v1 injected' /tmp/build.log
          grep -q 'id="actor-interaction-v1"' index.html
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('source/data/db-items.json').read_text(encoding='utf-8-sig'))
          mons=json.loads(Path('source/data/db-monsters.json').read_text(encoding='utf-8-sig'))
          npcs=json.loads(Path('source/data/db-npcs.json').read_text(encoding='utf-8-sig'))
          assert '솜털' in items and '보풀' not in items
          fabre=next(x for x in mons.values() if x.get('name')=='파브르')
          assert '솜털' in fabre.get('drops',{}) and '보풀' not in fabre.get('drops',{})
          assert npcs['대장장이 안토니오']['map']=='페이욘'
          assert '얼음 심장 2개' in npcs['아바사르']['dialog']
          PY
      - name: Commit rebased patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py source/data/db-items.json source/data/db-monsters.json source/data/db-npcs.json source/quest-guide.js source/services.js source/template.html index.html "룬미드가츠_v9.19.html"
          git commit -m "fix(quest): 원작 아이템명·획득처 정합화"
          git push origin HEAD:fix/quest-item-sources-rebase
