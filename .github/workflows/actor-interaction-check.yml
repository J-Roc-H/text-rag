name: actor-interaction-check

on:
  push:
    branches:
      - feat/actor-interaction
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/actor-interaction

      - name: Patch mobile summary clipping once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/actor-interaction.js')
          s = p.read_text(encoding='utf-8')
          old = '.ai-scene-summary{font-size:10px'
          new = '.ai-scene-summary{display:block;font-size:10px'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          if ! git diff --quiet -- source/actor-interaction.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add source/actor-interaction.js
            git commit -m 'fix: clip actor scene summaries on mobile'
            git push origin HEAD:feat/actor-interaction
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax
        run: python -m py_compile build.py

      - name: Actor interaction JS syntax
        run: node --check source/actor-interaction.js

      - name: Actor interaction runtime smoke
        run: node tests/actor-interaction-smoke.js

      - name: Build single HTML
        run: python build.py

      - name: Verify injected actor interaction
        shell: bash
        run: |
          grep -q 'id="actor-interaction-v1"' index.html
          grep -q 'window.showNpcModal=aiRenderLocalScene' index.html
          grep -q 'actor interaction v1' index.html
          test -s '룬미드가츠_v9.19.html'
