name: actor-interaction-check

on:
  push:
    branches:
      - feat/refine-reveal-and-object-canon

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore main bytes and reapply two actorType fields
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- source/data/db-npcs.json
          python - <<'PY'
          from pathlib import Path
          p=Path('source/data/db-npcs.json')
          b=p.read_bytes()
          pairs=[
            (
              '"이미르의 책": {"map": "유노", "emoji": "📖", "dialog": "낡은 책장 위에 놓인 거대한 고서. 펼쳐진 면에서 희미한 빛이 새어 나온다.", "service": "ymir_book"}',
              '"이미르의 책": {"map": "유노", "emoji": "📖", "actorType": "object", "dialog": "낡은 책장 위에 놓인 거대한 고서. 펼쳐진 면에서 희미한 빛이 새어 나온다.", "service": "ymir_book"}'
            ),
            (
              '"바이오랩 트리거": {"map": "생체연구소 1층", "emoji": "⚗️", "dialog": "...어두운 공간에서 이상한 기계음이 들린다. 수갑을 소지하고 있다면 무언가를 할 수 있을 것 같다.", "service": ""}',
              '"바이오랩 트리거": {"map": "생체연구소 1층", "emoji": "⚗️", "actorType": "object", "dialog": "...어두운 공간에서 이상한 기계음이 들린다. 수갑을 소지하고 있다면 무언가를 할 수 있을 것 같다.", "service": ""}'
            ),
          ]
          for old,new in pairs:
              oldb,newb=old.encode('utf-8'),new.encode('utf-8')
              if b.count(oldb)!=1:
                  raise SystemExit(f'expected one exact byte match: {old}')
              b=b.replace(oldb,newb,1)
          p.write_bytes(b)
          PY
          git diff --numstat -- source/data/db-npcs.json

      - name: Commit normalized diff
        shell: bash
        run: |
          git config user.name 'Da Bimci'
          git config user.email '284856624+J-Roc-H@users.noreply.github.com'
          git add source/data/db-npcs.json
          git commit -m 'chore: preserve npc db line endings'
          git push origin HEAD:feat/refine-reveal-and-object-canon
