name: actor-interaction-check

on:
  push:
    branches:
      - feat/actor-interaction
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax
        run: python -m py_compile build.py

      - name: Actor interaction JS syntax
        run: node --check source/actor-interaction.js

      - name: Actor interaction runtime smoke
        run: node tests/actor-interaction-smoke.js

      - name: Build single HTML
        run: python build.py

      - name: Verify injected actor interaction
        shell: bash
        run: |
          grep -q 'id="actor-interaction-v1"' index.html
          grep -q 'window.showNpcModal=aiRenderLocalScene' index.html
          grep -q 'actor interaction v1' index.html
          test -s '룬미드가츠_v9.19.html'

      - name: Create visual preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          boot = r'''
          <script>
          (function(){
            try {
              G.player = {
                name:'검증용 모험가', job:'노비스', baseLv:12, jobLv:10, zeny:1500,
                inventory:{'클로버':7,'솜털':10,'젤로피':4}, equip:{}, skills:{},
                quests:{}, jobQuests:{}, unlockedMaps:{}, visitedMaps:{'프론테라':true}, records:{},
                killCount:{}, statusEffects:{}, savedMap:'프론테라'
              };
              G.currentMap='프론테라'; G.autoHunt=false; G.battles=[];
              var lobby=document.getElementById('lobby'); if(lobby) lobby.style.display='none';
              var app=document.getElementById('app'); if(app) app.style.display='block';
              if(typeof initQuests==='function') initQuests(G.player);
              setTimeout(function(){ showNpcModal(); }, 80);
            } catch(e) {
              document.body.insertAdjacentHTML('beforeend','<pre id="preview-error">'+String(e.stack||e)+'</pre>');
            }
          })();
          </script>
          '''
          s = s.replace('</body>', boot + '\n</body>', 1)
          Path('actor-preview.html').write_text(s, encoding='utf-8')
          PY

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --virtual-time-budget=1200 --screenshot=actor-preview-desktop.png "file://$PWD/actor-preview.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=1200 --screenshot=actor-preview-mobile.png "file://$PWD/actor-preview.html"
          test -s actor-preview-desktop.png
          test -s actor-preview-mobile.png

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: actor-interaction-preview
          path: |
            actor-preview-desktop.png
            actor-preview-mobile.png
          retention-days: 3
