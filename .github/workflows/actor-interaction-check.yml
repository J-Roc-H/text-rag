name: actor-interaction-check

on:
  push:
    branches:
      - feat/refine-reveal-and-object-canon
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax
        run: python -m py_compile build.py

      - name: Actor interaction JS syntax
        run: node --check source/actor-interaction.js

      - name: Refine reveal JS syntax
        run: node --check source/refine-reveal.js

      - name: Actor interaction runtime smoke
        run: node tests/actor-interaction-smoke.js

      - name: Refine reveal runtime smoke
        run: node tests/refine-reveal-smoke.js

      - name: Canonical object actors
        shell: bash
        run: |
          grep -q '"이미르의 책".*"actorType": "object"' source/data/db-npcs.json
          grep -q '"바이오랩 트리거".*"actorType": "object"' source/data/db-npcs.json
          test "$(grep -o '"actorType": "object"' source/data/db-npcs.json | wc -l)" -eq 2

      - name: Build single HTML
        run: python build.py

      - name: Verify injected interaction layers
        shell: bash
        run: |
          grep -q 'id="actor-interaction-v1"' index.html
          grep -q 'id="refine-reveal-v1"' index.html
          grep -q '으허허헉!!!!' index.html
          test -s '룬미드가츠_v9.19.html'
