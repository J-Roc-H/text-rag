name: oneoff-fix-consumable-weights-clean

on:
  push:
    branches:
      - fix/pre-re-consumable-weights-clean
    paths:
      - '.github/workflows/_oneoff-fix-consumable-weights-clean.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-re-consumable-weights-clean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned rAthena pre-re DB
        run: |
          set -euo pipefail
          RATHENA_SHA=e985006171d2eb320ee512a653f4c83aea3d81b6
          mkdir -p /tmp/rathena-pre-re
          for f in usable etc equip; do
            curl -fsSL https://raw.githubusercontent.com/rathena/rathena/${RATHENA_SHA}/db/pre-re/item_db_${f}.yml -o /tmp/rathena-pre-re/item_db_${f}.yml
          done
          pip install --quiet pyyaml
      - name: Repair source data with original file format preserved
        run: |
          cat > /tmp/fix_weights.py <<'PY'
          import json, yaml, pathlib, codecs
          repo=pathlib.Path('.')
          path=repo/'source/data/db-items.json'
          raw=path.read_bytes()
          had_bom=raw.startswith(codecs.BOM_UTF8)
          newline='\r\n' if b'\r\n' in raw else '\n'
          items=json.loads(raw.decode('utf-8-sig'))
          src={}
          for fn in ['item_db_usable.yml','item_db_etc.yml','item_db_equip.yml']:
              data=yaml.safe_load((pathlib.Path('/tmp/rathena-pre-re')/fn).read_text(encoding='utf-8')) or {}
              for r in data.get('Body',[]):
                  if r.get('AegisName'): src[r['AegisName']]=r

          M={
          '각성의 포션':'Awakening_Potion','강철의 화살':'Steel_Arrow','강철의 화살통':'Steel_Arrow_Container',
          '고기':'Meat','고목나무 가지':'Branch_Of_Dead_Tree','그림자의 화살':'Arrow_Of_Shadow','그림자화살통':'Shadow_Arrow_Container',
          '꿀':'Honey','나비의 날개':'Wing_Of_Butterfly','날카로운 화살':'Incisive_Arrow','낡은 카드첩':'Old_Card_Album',
          '노란포션':'Yellow_Potion','녹슨 화살':'Rusty_Arrow','녹슨 화살통':'Rusty_Arrow_Container','독화살':'Poison_Arrow',
          '딸기':'Strawberry','마스텔라의 열매':'Fruit_Of_Mastela','몬스터 사료':"Monster's_Feed",'무형의 화살':'Immatrial_Arrow',
          '무형의 화살통':'Imma_Arrow_Container','바람 화살통':'Wind_Arrow_Container','바람의 화살':'Arrow_Of_Wind',
          '불화살':'Fire_Arrow','불화살통':'Fire_Arrow_Container','빨간 허브':'Red_Herb','빨간포션':'Red_Potion','사과':'Apple',
          '사일런스 애로우':'Silence_Arrow','사탕':'Candy','선물상자':'Gift_Box','성수':'Holy_Water','성스러운 화살':'Holy_Arrow',
          '성스러운 화살통':'Holy_Arrow_Quiver','수정 화살':'Crystal_Arrow','수정 화살통':'Crystal_Arrow_Container',
          '스턴 애로우':'Stun_Arrow','슬립 애로우':'Sleep_Arrow','암석 화살':'Stone_Arrow','암석 화살통':'Stone_Arrow_Container',
          '옐로 허브':'Yellow_Herb','오래된보라상자':'Old_Violet_Box','오래된빨간상자':'Red_Box','오래된파란상자':'Old_Blue_Box',
          '오렌지':'Orange','오리데오콘 화살':'Oridecon_Arrow','오리데오콘 화살통':'Ori_Arrow_Container','웰스쿠키':'Well_Baked_Cookie',
          '은화살':'Silver_Arrow','은화살통':'Silver_Arrow_Container','조각케이크':'Piece_Of_Cake','주홍포션':'Orange_Potion',
          '철 화살':'Iron_Arrow','철 화살통':'Iron_Arrow_Container','초록포션':'Green_Potion','초록허브':'Green_Herb',
          '캔디 스트라이퍼':'Candy_Striper','커스 애로우':'Curse_Arrow','파란포션':'Blue_Potion','파란허브':'Blue_Herb',
          '파리의 날개':'Wing_Of_Fly','파마의 화살':'Arrow_Of_Counter_Evil','프리징 애로우':'Freezing_Arrow','플래쉬 애로우':'Flash_Arrow',
          '하얀포션':'White_Potion','하얀허브':'White_Herb','화살':'Arrow','화살통':'Arrow_Container'
          }
          hold={'보물상자','조합 키트','황금포션'}
          changed=[]; verified=[]; unresolved=[]
          for key,it in items.items():
              if it.get('type')!='소모품': continue
              aegis=it.get('_aegis') or M.get(key)
              if not aegis:
                  unresolved.append(key); continue
              if aegis not in src: raise SystemExit(f'원본 Aegis 미확인: {key} -> {aegis}')
              r=src[aegis]
              w=(r.get('Weight',0) or 0)/10
              if float(w).is_integer(): w=int(w)
              before=(it.get('weight'),it.get('_aegis'),it.get('weightSrc'))
              it['_aegis']=aegis; it['weight']=w; it['weightSrc']='official'
              verified.append((key,aegis,w,r.get('Id'),r.get('Name')))
              if before!=(w,aegis,'official'): changed.append((key,before[0],w,aegis,r.get('Id'),r.get('Name')))
          if set(unresolved)!=hold: raise SystemExit(f'예상 밖 미연결 소모품: {unresolved}')

          out=json.dumps(items,ensure_ascii=False,indent=2)+'\n'
          if newline=='\r\n': out=out.replace('\n','\r\n')
          data=out.encode('utf-8')
          if had_bom: data=codecs.BOM_UTF8+data
          path.write_bytes(data)

          lines=['# 소모품 무게 정합화 패치','',
                 '- 기준: rAthena pre-re item DB',
                 '- 고정 원본 SHA: `e985006171d2eb320ee512a653f4c83aea3d81b6`',
                 '- 환산: rAthena `Weight / 10 = TextRAG 무게`',
                 f'- 원본 직접 검증: **{len(verified)} / 90**',
                 f'- 데이터/출처 연결 변경: **{len(changed)}**',
                 f'- 보류: **{len(unresolved)}**', '',
                 '## 변경 항목','',
                 '| TextRAG | 기존 | 수정 | Aegis | rAthena ID | 원작명 |','|---|---:|---:|---|---:|---|']
          for k,b,a,ae,iid,nm in changed: lines.append(f'| {k} | {b} | **{a}** | `{ae}` | {iid} | {nm} |')
          lines += ['', '## 보류','']
          for k in sorted(unresolved): lines.append(f'- `{k}`: 원작 동일 항목으로 단정할 수 없는 TextRAG 고유/변형 소모품. 기존 값 유지, 별도 설계 검토.')
          lines += ['', '## 완료 조건','',
                    '- `_aegis` 연결 소모품 87개가 고정 원본 `Weight/10`과 전부 일치한다.',
                    '- 화살류 소수 무게 0.1~0.3을 반올림/절삭하지 않는다.',
                    '- 보류 3개는 임의로 원작 항목에 매핑하지 않는다.','']
          (repo/'CONSUMABLE_WEIGHT_PATCH_NOTES.md').write_text('\n'.join(lines),encoding='utf-8')
          print('verified=',len(verified),'changed=',len(changed),'hold=',sorted(unresolved))
          PY
          python /tmp/fix_weights.py
      - name: Full source validation and build
        run: |
          python - <<'PY'
          import json, yaml, pathlib
          items=json.loads(pathlib.Path('source/data/db-items.json').read_text(encoding='utf-8-sig'))
          src={}
          for fn in ['item_db_usable.yml','item_db_etc.yml','item_db_equip.yml']:
              data=yaml.safe_load((pathlib.Path('/tmp/rathena-pre-re')/fn).read_text()) or {}
              for r in data.get('Body',[]):
                  if r.get('AegisName'): src[r['AegisName']]=r
          consumables={k:v for k,v in items.items() if v.get('type')=='소모품'}
          mapped=[]; mismatch=[]; unresolved=[]
          for k,v in consumables.items():
              a=v.get('_aegis')
              if not a: unresolved.append(k); continue
              if a not in src: mismatch.append((k,'source missing',a)); continue
              expected=(src[a].get('Weight',0) or 0)/10
              if float(expected).is_integer(): expected=int(expected)
              if v.get('weight')!=expected or v.get('weightSrc')!='official': mismatch.append((k,v.get('weight'),expected,a,v.get('weightSrc')))
              else: mapped.append(k)
          assert len(consumables)==90, len(consumables)
          assert len(mapped)==87, len(mapped)
          assert not mismatch, mismatch
          assert set(unresolved)=={'보물상자','조합 키트','황금포션'}, unresolved
          assert items['노란포션']['weight']==13
          assert items['파란포션']['weight']==15
          assert items['하얀포션']['weight']==15
          assert items['화살']['weight']==0.1
          assert items['화살통']['weight']==25
          print('OK - 87/90 source-linked consumables exact; 3 custom held')
          PY
          python build.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/data/db-items.json CONSUMABLE_WEIGHT_PATCH_NOTES.md index.html "룬미드가츠_v9.19.html"
          git commit -m "fix(items): restore pre-re consumable weights"
          git push origin HEAD:fix/pre-re-consumable-weights-clean
