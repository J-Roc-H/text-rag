    </div>
    <div class="form-row" style="margin-top:4px;">
      <span class="form-lbl" style="font-size:11px;">아이템 검색</span>
      <input type="text" id="e-item-filter" placeholder="아이템명 입력..." oninput="editorFilterItemList()"
        style="padding:4px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;max-width:150px;">
    </div>
    <div class="form-row" style="margin-top:4px;">
      <span class="form-lbl" style="font-size:11px;">아이템 선택</span>
      <select id="e-item-select" size="5"
        style="padding:4px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;max-width:150px;">
        ${Object.keys(DB.items).filter(k=>{const t=DB.items[k].type;return ['소모품','잡템','재료','퀘스트아이템'].includes(t);}).sort().map(k=>`<option value="${k}" data-type="${DB.items[k].type}">${k}</option>`).join('')}
      </select>
    </div>
    <div class="form-row" style="margin-top:4px;">
      <span class="form-lbl" style="font-size:11px;">수량</span>
      <input type="number" id="e-item-qty" value="1" min="1" max="999"
        style="width:55px;padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;">
    </div>
    <button onclick="editorGiveItem()"
      style="margin-top:6px;width:100%;padding:6px;background:#d5f5e3;color:#1e8449;border:1px solid #82e0aa;border-radius:3px;font-size:11px;font-weight:bold;cursor:pointer;">
      🎒 선택한 아이템 지급
    </button>
  </div>

  <!-- ■ 버프/디버프 직접 적용 -->
  <div style="background:#fdf2f8;border-radius:4px;padding:8px 10px;margin-bottom:8px;">
    <div style="font-size:11px;font-weight:bold;color:#8e44ad;margin-bottom:6px;">✨ 버프/디버프 직접 적용</div>
    <div class="form-row">
      <span class="form-lbl" style="font-size:11px;">버프 선택</span>
      <select id="e-buff-key" onchange="editorUpdateBuffHint()"
        style="padding:4px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;max-width:160px;">
        ${_bOpts}
      </select>
    </div>
    <div class="form-row" style="margin-top:4px;">
      <span class="form-lbl" style="font-size:11px;">턴 수 / 횟수</span>
      <input type="number" id="e-buff-turns" value="3000" min="1" max="99999"
        style="width:70px;padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;">
    </div>
    <div class="form-row" style="margin-top:4px;">
      <span class="form-lbl" style="font-size:11px;">수치</span>
      <input type="number" id="e-buff-val" value="10" step="0.01"
        style="width:70px;padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;">
    </div>
    <div id="e-buff-hint" style="font-size:11px;color:var(--text-dim);margin:3px 0 6px 0;padding-left:2px;">STR/INT/DEX +수치</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <button onclick="editorApplyBuff()"
        style="padding:6px;background:#e8d5f5;color:#8e44ad;border:1px solid #c39bd3;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;">
        ✨ 적용
      </button>
      <button onclick="editorRemoveBuff()"
        style="padding:6px;background:#fdf5f5;color:#c0392b;border:1px solid #f1948a;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;">
        🗑️ 해제
      </button>
    </div>
  </div>

  <!-- ■ 즉시 실행 액션 -->
  <div style="background:#fef9f0;border-radius:4px;padding:8px 10px;margin-bottom:8px;">
    <div style="font-size:11px;font-weight:bold;color:#d35400;margin-bottom:6px;">⚡ 즉시 실행</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
	
      <button onclick="editorFullHeal()"
        style="padding:7px;background:#eafaf1;color:#1e8449;border:1px solid #82e0aa;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;">
        ❤️ HP/SP 완전 회복
      </button>
	  <button onclick="editorApplyAllBuffs()" 
        style="padding:7px;background:#ebf5fb;color:#2874a6;border:1px solid #aed6f1;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer; margin-left: 5px;">
		✨ 민블 3000턴 적용
	  </button>
      <button onclick="editorClearStatus()"
        style="padding:7px;background:#eaf4fb;color:#2980b9;border:1px solid #85c1e9;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;">
        ✨ 상태이상 전체 해제
      </button>
      <button onclick="editorClearBattle()"
        style="padding:7px;background:#fff5f5;color:#c0392b;border:1px solid #f1948a;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;">
        🏃 전투 즉시 종료
      </button>
      <button onclick="editorMaxStats()"
        style="padding:7px;background:#fdfaf0;color:#d4ac0d;border:1px solid #f9e79f;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;">
        ⭐ 스탯 포인트 +100
      </button>
    </div>
  </div>

  <!-- ■ 맵 이동 -->
  <div style="background:#f0faf5;border-radius:4px;padding:8px 10px;margin-bottom:8px;">
    <div style="font-size:11px;font-weight:bold;color:#1e8449;margin-bottom:6px;">🗺 맵 직접 이동</div>
    <div class="form-row">
      <span class="form-lbl" style="font-size:11px;">이동할 맵</span>
      <select id="e-map" style="padding:4px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;max-width:150px;">
        ${Object.keys(DB.maps).map(m=>`<option value="${m}" ${m===G.currentMap?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
    <button onclick="editorTeleport()"
      style="margin-top:6px;width:100%;padding:6px;background:#d5f5e3;color:#1e8449;border:1px solid #82e0aa;border-radius:3px;font-size:11px;font-weight:bold;cursor:pointer;">
      🌀 선택한 맵으로 이동
    </button>
  </div>

  <!-- ■ 게임 밸런스 배율 -->
  <div style="background:#f5f5f5;border-radius:4px;padding:8px 10px;">
    <div style="font-size:11px;font-weight:bold;color:var(--text-dim);margin-bottom:6px;">⚙️ 게임 밸런스 배율 (기본값 1)</div>
    <div class="form-row"><span class="form-lbl">경험치 배율</span><input class="form-input" id="s-exp" value="${s.expRate}"></div>
    <div class="form-row"><span class="form-lbl">아이템 드랍률</span><input class="form-input" id="s-drop" value="${s.dropRate}"></div>
    <div class="form-row"><span class="form-lbl">카드 드랍률</span><input class="form-input" id="s-card" value="${s.cardRate}"></div>
    <div class="form-row"><span class="form-lbl">몹 출현률</span><input class="form-input" id="s-spawn" value="${s.spawnRate}"></div>
    <div class="form-row"><span class="form-lbl">자동 회복 배율</span><input class="form-input" id="s-regen" value="${s.regenRate}"></div>
  </div>`;

  openModal('✏️ 에디터', h, [
    {label:'적용', cls:'ok', action:()=>{
      // 캐릭터 기본
      p.name     = $('e-n').value || '모험가';
      p.zeny     = parseInt($('e-z').value)||0;
      p.baseLv   = Math.min(99, Math.max(1, parseInt($('e-bl').value)||1));
      p.jobLv    = Math.min(70, Math.max(1, parseInt($('e-jl').value)||1));
      p.baseExp  = parseInt($('e-bexp').value)||0;
      p.jobExp   = parseInt($('e-jexp').value)||0;
      p.skillPoints = parseInt($('e-sp').value)||0;
      // 스탯
      p.statPoints = parseInt($('e-pts').value)||0;
      // 에디터는 치트 도구이므로 포인트 비용은 검사하지 않되, 원작 상한 99는 지킨다
      STAT_KEYS.forEach(k=>{
        p[k] = Math.min(STAT_CAP, Math.max(1, parseInt($('e-'+k).value)||1));
      });
      // 전직 토글
      p.editorFlags.skipJobReq = !!$('tog-skipjob').checked;
      // 배율
      p.settings.expRate   = parseFloat($('s-exp').value)||1;
      p.settings.dropRate  = parseFloat($('s-drop').value)||1;
      p.settings.cardRate  = parseFloat($('s-card').value)||1;
      p.settings.spawnRate = parseFloat($('s-spawn').value)||1;
      p.settings.regenRate = parseFloat($('s-regen').value)||1;

      updateUI();
      log('⚙️ <b>[에디터]</b> 설정이 적용되었습니다.','system');
    }},
    {label:'닫기', action:()=>{}}
  ]);
}

/** 몬스터 편집기 — 목록 뷰 */
function showMonsterListEditor() {
  let curFilter = (document.getElementById('mle-filter') || {}).value || '';
  let ids = Object.keys(DB.monsters).sort((a,b) => parseInt(a)-parseInt(b));
  if (curFilter.trim()) {
    let fl = curFilter.trim().toLowerCase();
    ids = ids.filter(id => id === fl || (DB.monsters[id].name||'').toLowerCase().includes(fl));
  }

  let listRows = ids.map(id => {
    let m = DB.monsters[id];
    return `<div style="display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:11px;">
      <span style="color:var(--text-dim);font-size:10px;min-width:26px;flex-shrink:0;">#${id}</span>
      <span style="min-width:16px;flex-shrink:0;">${m.emoji||''}</span>
      <span style="flex:1;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.name}</span>
      <span style="color:var(--text-dim);font-size:10px;white-space:nowrap;flex-shrink:0;">Lv${m.lv}</span>
      <button onclick="showMonsterEditModal('${id}')"
        style="padding:1px 6px;background:#d6eaf8;color:#2471a3;border:1px solid #85c1e9;border-radius:3px;font-size:10px;cursor:pointer;flex-shrink:0;">
        ✏️
      </button>
    </div>`;
  }).join('');

  let h = `
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
    <input type="text" id="mle-filter" value="${curFilter.replace(/"/g,'&quot;')}" placeholder="ID 또는 이름 검색..."
      oninput="showMonsterListEditor()"
      style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;">
    <span style="font-size:10px;color:var(--text-dim);white-space:nowrap;">${ids.length}마리</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;background:#fff;">
    ${listRows || '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-dim);font-size:12px;">검색 결과 없음</div>'}
  </div>
  <div style="margin-top:6px;font-size:10px;color:var(--text-dim);">편집 완료 후 💾 HTML 저장을 눌러야 파일에 영구 반영됩니다.</div>`;

  openModal('🐉 몬스터 DB 편집', h, [
    {label:'💾 HTML 저장', cls:'ok', action: exportModifiedHTML, close:false},
    {label:'닫기', action:()=>{}}
  ]);
}

/** 몬스터 편집기 — 개별 편집 뷰 (2컬럼) */
function showMonsterEditModal(id) {
  let m = DB.monsters[id];
  if (!m) { notify('존재하지 않는 몬스터 ID: ' + id, 'red'); return; }

  let numId = parseInt(id);
  let spawnMaps = Object.keys(DB.maps).filter(mapName => {
    let arr = DB.maps[mapName].monsters || [];
    return arr.some(x => x === numId || x === id || x === String(id));
  });

  // 아이템 선택 options 생성 (sel 과 일치하는 항목에 selected)
  let _mkOpts = (sel) => '<option value="">-- 선택 --</option>' +
    Object.keys(DB.items).sort().map(k => {
      let s = k.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<option value="' + s + '"' + (k === sel ? ' selected' : '') + '>' + s + '</option>';
    }).join('');
  window._monItemOpts = _mkOpts('');  // monEditAddDrop 에서 재사용

  // 드롭 아이템 행 (select 드롭다운)
  let dropRows = Object.entries(m.drops || {}).map(([item, rate]) =>
    '<div class="mon-drop-row" style="display:flex;gap:4px;align-items:center;margin-bottom:4px;">' +
    '<select class="drop-item-sel" style="flex:2;padding:3px 4px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;">' + _mkOpts(item) + '</select>' +
    '<input type="number" class="drop-item-rate" value="' + rate + '" step="0.01" min="0" max="100" style="width:52px;padding:3px 4px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;">' +
    '<span style="font-size:11px;color:var(--text-dim);">%</span>' +
    '<button onclick="this.closest(\'.mon-drop-row\').remove()" style="padding:2px 6px;background:#fee;color:#c0392b;border:1px solid #f1948a;border-radius:3px;font-size:10px;cursor:pointer;">✕</button>' +
    '</div>'
  ).join('');

  // 출몰 지역 체크박스
  let mapChecks = Object.keys(DB.maps).map(mapName => {
    let isChecked = spawnMaps.includes(mapName);
    let mapType = DB.maps[mapName].type || '';
    let safeMap = mapName.replace(/"/g,'&quot;');
    return '<label style="display:inline-flex;align-items:center;gap:3px;font-size:11px;margin:2px 6px 2px 0;cursor:pointer;' + (mapType==='마을'?'color:var(--text-dim);':'') + '">' +
      '<input type="checkbox" class="mon-map-cb" value="' + safeMap + '" ' + (isChecked?'checked':'') + '>' + mapName + '</label>';
  }).join('');

  let sizeOpts = ['소형','중형','대형'].map(s=>`<option ${(m.size||'')==s?'selected':''}>${s}</option>`).join('');
  let raceOpts = ['무형','식물','곤충','동물','어류','악마','인간','마귀','용족','천사','불사'].map(r=>`<option ${(m.race||'')==r?'selected':''}>${r}</option>`).join('');
  let elemOpts = ['무속성','수속성','지속성','화속성','풍속성','독속성','성속성','암속성','귀속성'].map(e=>`<option ${(m.element||'')==e?'selected':''}>${e}</option>`).join('');

  // 컴팩트 입력 헬퍼 (라벨 위, 인풋 아래)
  let inp = 'width:100%;box-sizing:border-box;padding:3px 5px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;';
  let lbl = 'font-size:10px;color:var(--text-dim);margin-bottom:1px;';
  let fi = (label, eid, val, type, extra) =>
    '<div style="margin-bottom:5px;"><div style="' + lbl + '">' + label + '</div>' +
    '<input id="' + eid + '" type="' + (type||'text') + '" value="' + String(val).replace(/"/g,'&quot;') + '" ' + (extra||'') + ' style="' + inp + '"></div>';
  let fsel = (label, eid, opts) =>
    '<div style="margin-bottom:5px;"><div style="' + lbl + '">' + label + '</div>' +
    '<select id="' + eid + '" style="' + inp + '">' + opts + '</select></div>';
  let fnum3 = (labels, eids, vals) => {
    let cells = labels.map((l,i) =>
      '<div><div style="' + lbl + '">' + l + '</div><input id="' + eids[i] + '" type="number" value="' + (vals[i]??0) +
      '" style="width:100%;box-sizing:border-box;padding:3px 4px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;"></div>'
    ).join('');
    return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:4px;">' + cells + '</div>';
  };
  let fnum2 = (labels, eids, vals) => {
    let cells = labels.map((l,i) =>
      '<div><div style="' + lbl + '">' + l + '</div><input id="' + eids[i] + '" type="number" value="' + (vals[i]??0) +
      '" style="width:100%;box-sizing:border-box;padding:3px 4px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:inherit;"></div>'
    ).join('');
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">' + cells + '</div>';
  };

  let h = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:start;">
  <!-- 1열: 기본정보 + 경험치/제니 -->
  <div>
    <div style="background:#eaf4fb;border-radius:4px;padding:7px 9px;margin-bottom:6px;">
      <div style="font-size:11px;font-weight:bold;color:var(--blue-light);margin-bottom:5px;">📋 기본 정보</div>
      ${fi('이름','me-name',m.name)}
      ${fi('이모지','me-emoji',m.emoji||'')}
      ${fi('레벨','me-lv',m.lv,'number')}
      ${fi('HP','me-hp',m.hp,'number')}
      ${fi('ATK','me-atk',m.atk,'number')}
    </div>
    <div style="background:#f5f5f5;border-radius:4px;padding:7px 9px;">
      <div style="font-size:11px;font-weight:bold;color:var(--text-dim);margin-bottom:5px;">💰 경험치 / 제니</div>
      ${fi('Base EXP','me-exp',m.exp??0,'number')}
      ${fi('Job EXP','me-jexp',m.jexp??0,'number')}
      ${fnum2(['제니 최소','제니 최대'],['me-zmin','me-zmax'],[(m.zeny||[0,0])[0],(m.zeny||[0,0])[1]])}
    </div>
  </div>
  <!-- 2열: 방어/전투 -->
  <div>
    <div style="background:#f0f5f9;border-radius:4px;padding:7px 9px;">
      <div style="font-size:11px;font-weight:bold;color:var(--gold-light);margin-bottom:5px;">🛡 방어 / 전투</div>
      ${fi('DEF (경감)','me-def',m.def??0,'number')}
      ${fi('softDEF','me-sdef',m.softDef??0,'number')}
      ${fi('MDEF','me-mdef',m.mdef??0,'number')}
      ${fi('HIT','me-hit',m.hit??0,'number')}
      ${fi('FLEE','me-flee',m.flee??0,'number')}
      ${fi('사거리','me-range',m.range??1,'number')}
      ${fi('공격딜레이(ms)','me-delay',m.atkDelay??2000,'number')}
    </div>
  </div>
  <!-- 3열: 어빌리티 + 속성/종족/크기 -->
  <div>
    <div style="background:#f5faf0;border-radius:4px;padding:7px 9px;margin-bottom:6px;">
      <div style="font-size:11px;font-weight:bold;color:#1e8449;margin-bottom:5px;">📊 어빌리티</div>
      ${fnum3(['STR','AGI','VIT'],['me-str','me-agi','me-vit'],[m.str,m.agi,m.vit])}
      ${fnum3(['INT','DEX','LUK'],['me-int','me-dex','me-luk'],[m.int,m.dex,m.luk])}
    </div>
    <div style="background:#fdfaf0;border-radius:4px;padding:7px 9px;">
      <div style="font-size:11px;font-weight:bold;color:var(--gold);margin-bottom:5px;">🔮 속성 / 종족 / 크기</div>
      ${fsel('속성','me-elem',elemOpts)}
      ${fi('속성 레벨','me-elemlv',m.elementLv??1,'number','min="1" max="4"')}
      ${fsel('종족','me-race',raceOpts)}
      ${fsel('크기','me-size',sizeOpts)}
    </div>
  </div>
</div>
<div style="background:#fff5f0;border-radius:4px;padding:7px 9px;margin-top:8px;">
  <div style="font-size:11px;font-weight:bold;color:#d35400;margin-bottom:5px;">🎁 드롭 아이템</div>
  <div id="me-drops-container">${dropRows}</div>
  <button onclick="monEditAddDrop()" style="width:100%;padding:4px;background:#fef9f0;color:#d35400;border:1px dashed #f0b27a;border-radius:3px;font-size:11px;cursor:pointer;margin-top:4px;">＋ 드롭 추가</button>
  <div style="font-size:11px;color:var(--text-dim);margin-top:3px;">확률 단위: % (예: 0.01 = 0.01%, 70 = 70%)</div>

/** 편집 내용을 DB.monsters / DB.maps 메모리에 반영 */
function saveMonsterEdit(id) {
  let m = DB.monsters[id];
  if (!m) return;
  let gi = elId => document.getElementById(elId);
  let iv = (elId, fallback=0) => { let v = parseInt(gi(elId)?.value); return isNaN(v) ? fallback : v; };
  let fv = (elId, fallback=0) => { let v = parseFloat(gi(elId)?.value); return isNaN(v) ? fallback : v; };

  // 기본 정보
  m.name     = gi('me-name').value.trim()  || m.name;
  m.emoji    = gi('me-emoji').value.trim();
  m.lv       = iv('me-lv', 1);
  m.hp       = iv('me-hp', 1);
  m.atk      = iv('me-atk', 0);
  // 방어/전투
  m.def      = iv('me-def');
  m.softDef  = iv('me-sdef');
  m.mdef     = iv('me-mdef');
  m.hit      = iv('me-hit');
  m.flee     = iv('me-flee');
  m.range    = iv('me-range', 1);
  m.atkDelay = iv('me-delay', 2000);
  // 어빌리티
  m.str = iv('me-str'); m.agi = iv('me-agi'); m.vit = iv('me-vit');
  m.int = iv('me-int'); m.dex = iv('me-dex'); m.luk = iv('me-luk');
  // 속성/종족/크기
  m.element   = gi('me-elem').value;
  m.elementLv = iv('me-elemlv', 1);
  m.race      = gi('me-race').value;
  m.size      = gi('me-size').value;
  // 경험치/제니
  m.exp  = iv('me-exp');
  m.jexp = iv('me-jexp');
  m.zeny = [iv('me-zmin'), iv('me-zmax')];

  // 드롭 아이템 재구성
  let newDrops = {};
  document.querySelectorAll('#me-drops-container .mon-drop-row').forEach(row => {
    let name = row.querySelector('.drop-item-sel')?.value.trim();
    let rate = parseFloat(row.querySelector('.drop-item-rate')?.value);
    if (name && !isNaN(rate) && rate >= 0) newDrops[name] = rate;
  });
  m.drops = newDrops;

  // 출몰 지역 반영
  let numId = parseInt(id);
  document.querySelectorAll('.mon-map-cb').forEach(cb => {
    let mp = DB.maps[cb.value];
    if (!mp) return;
    mp.monsters = mp.monsters || [];
    let has = mp.monsters.some(x => x === numId || x === id || x === String(id));
    if (cb.checked && !has) {
      mp.monsters.push(numId);
    } else if (!cb.checked && has) {
      mp.monsters = mp.monsters.filter(x => x !== numId && x !== id && x !== String(id));
    }
  });

  log(`🐉 <b>[에디터]</b> #${id} ${m.name} 수정 완료 (메모리 반영). HTML 저장 시 파일에 기록됩니다.`, 'system');
  notify(`${m.name} 저장됨`, 'gold');
}

/** 수정된 DB를 포함한 HTML 파일 다운로드 */
function exportModifiedHTML() {
  try {
    // 메모리의 DB 객체를 script 태그에 반영
    document.getElementById('db-monsters').textContent = '\n' + JSON.stringify(DB.monsters, null, 2) + '\n';
    document.getElementById('db-maps').textContent     = '\n' + JSON.stringify(DB.maps,     null, 2) + '\n';
    // 전체 HTML 직렬화 및 다운로드
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    let blob = new Blob([html], {type:'text/html;charset=utf-8'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    let rawName = location.pathname.split('/').pop() || '룬미드가츠.html';
    try { rawName = decodeURIComponent(rawName); } catch(e){}
    a.download = rawName.replace(/\.html$/i, '_edited.html');
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    notify('💾 HTML 저장 완료!', 'gold');
    log('💾 <b>[에디터]</b> 수정된 HTML 파일 다운로드 시작.', 'system');
  } catch(e) {
    notify('저장 실패: ' + e.message, 'red');
  }
}

/** 스킬 전체 초기화 (포인트 반환) */
function editorResetSkills(){
  let p = G.player;
  if(!confirm('모든 스킬을 초기화하고 포인트를 반환합니까?')) return;
  // 사용된 포인트 계산 후 반환
  let usedPoints = Object.entries(p.skills||{}).reduce((sum,[name,lv])=>{
    // 전직 시 기본 지급 스킬(레벨1)은 포인트 소모 없이 주어진 것이므로 제외
    let sk = DB.skills[name];
    if(!sk) return sum;
    // 기본 지급 여부: DB.jobInitSkills 전체에서 해당 스킬코드가 있으면 lv-1만 반환
    let skCode = DB.skName2Code?.[name];
    let isInit = skCode && Object.values(DB.jobInitSkills||{}).some(arr=>arr.includes(skCode));
    return sum + (isInit ? Math.max(0, lv-1) : lv);
  }, 0);
  p.skillPoints = (p.skillPoints||0) + usedPoints;
  // 기본 지급 스킬만 남기고 나머지 제거
  let newSkills = {};
  Object.entries(p.skills||{}).forEach(([name, lv])=>{
    let skCode = DB.skName2Code?.[name];
    let isInit = skCode && Object.values(DB.jobInitSkills||{}).some(arr=>arr.includes(skCode));
    if(isInit) newSkills[name] = 1;
  });
  p.skills = newSkills;
  log(`🔄 <b>[에디터]</b> 스킬 초기화 완료. 포인트 ${usedPoints}점 반환.`,'level-up');
  updateUI(); notify('스킬 초기화 완료','gold'); showEditModal();
}

  };

  let chain = new Set(jobCode ? (JOB_SKILL_CHAIN[jobCode] || [jobCode]) : []);

/** 에디터 — SE 오브젝트 생성 (key, turns, value, player) */
function buildEditorSE(key, turns, val, p){
  const t = parseInt(turns)||3000;
  const v = parseFloat(val)||0;
  const mxHp = p.maxHp||1000;
  switch(key){
    case 'blessing':        return {turns:t, str:v, int:v, dex:v};
    case 'agility':         return {turns:t, agi:v};
    case 'angelus':         return {turns:t, def:v};
    case 'concentration':   return {turns:t, agi:v, dex:v};
    case 'gloria':          return {turns:t, luk:v};
    case 'warDrum':         return {turns:t, def:v};
    case 'whistle':         return {turns:t, flee:v};
    case 'humming':         return {turns:t, hit:v};
    case 'luckyKiss':       return {turns:t, crit:v};
    case 'idunApple':       return {turns:t, hpBonus:v};
    case 'serviceForYou':   return {turns:t, spBonus:v};
    case 'imposMannus':     return {turns:t, atkBonus:v, matkBonus:v};
    case 'magnificat':      return {turns:t, regenMul:2};
    case 'massGrace':       return {turns:t, spRegen:v};
    case 'thQuicken':       return {turns:t, rate:v};
    case 'spearQuicken':    return {turns:t, rate:v};
    case 'sunsetCross':     return {turns:t, rate:v};
    case 'bragi':           return {turns:t, castReduce:v, delayReduce:v};
    case 'suffragium':      return {turns:t, castReduce:v};
    case 'autoSpell':       return {turns:t, rate:v};
    case 'enchantPoison':   return {turns:t, poisonChance:v};
    case 'maximizePower':   return {turns:t, spDrainPerTurn:2};
    case 'explosion':       return {turns:t, atkRate:v};
    case 'overThrust':      return {turns:t, rate:v};
    case 'nibelung':        return {turns:t, weaponBonus:v};
    case 'loudBang':        return {turns:t, atkRate:v};
    case 'ampMagic':        return {count:1, matkBonus:v};
    case 'lexAeterna':      return {count:1};
    case 'kyrie':           return {count:Math.floor(v)||10, absorbPerHit:Math.floor(mxHp*0.1)};
    case 'safetyWall':      return {count:Math.floor(v)||10, turns:t};
    case 'devotion':        return {turns:t, dmgReduce:v};
    case 'defender':        return {turns:t};
    case 'diamondBody':     return {turns:t, dmgReduce:v};
    case 'siegfried':       return {turns:t, eleRes:v};
    case 'godsBless':       return {turns:t, holyRes:v};
    case 'endure':          return {turns:t, mdef:v};
    case 'autoGuard':       return {turns:t, rate:v};
    case 'sanctuary':       return {turns:t, healPerTurn:v};
    case 'richManKim':      return {turns:t, dropBonus:v};
    case 'redemptio':       return {turns:9999};
    case 'resurrectBuff':   return {turns:9999, hp:0.5};
    case 'poisonReact':     return {count:Math.floor(v)||5, dmg:100};
    case 'spiritSphere':    return Math.floor(v)||5;
    default:                return {turns:t};
  }
}

// 1. 몬스터 출현 (조우 기록)
// ── [ 원거리 시스템: 직업별 초기 거리 ] ──
function getInitialDistance(player) {
  const code = JOB_NAME2CODE[normalizeJob(player.job)];
  if (['JOB_HNT','JOB_SNP'].includes(code)) return 10;
  if (['JOB_BRD','JOB_MIN','JOB_DNC','JOB_GYP'].includes(code)) return 9;
  if (['JOB_ARC','JOB_HARC'].includes(code)) return Math.random() < 0.5 ? 7 : 8;
  if (['JOB_MG','JOB_HMG','JOB_WIZ','JOB_HWZ','JOB_SGE','JOB_PRF',
       'JOB_ACO','JOB_HACO','JOB_PRI','JOB_HPR'].includes(code)) {
    return ['JOB_MG','JOB_HMG','JOB_ACO','JOB_HACO'].includes(code) ? 5 : 6;
  }
  return 1;
}

function spawnMvpSlaves(mvpMon, initDist){
  if(!mvpMon.slaves || !mvpMon.slaves.length) return;
  let slaveNames = [];
  mvpMon.slaves.forEach(([sid,cnt])=>{
    let sm = DB.monsters[String(sid)]; if(!sm) return;
    for(let i=0;i<cnt;i++){
      G.battles.push(Object.assign({},sm,{currentHp:sm.hp,maxHp:sm.hp,statusEffects:{},distance:initDist}));
      slaveNames.push(sm.emoji+sm.name);
    }
  });
  if(slaveNames.length) log(`👥 슬레이브 소환: ${slaveNames.join(', ')}`, 'warning');
}

// ══════════════════════════════════════════════
// ── [2-9] 구역(zone) 시스템 — 범용 자동 생성
//   맵별 데이터 작업 없이 md.monsters를 몬스터 레벨순 정렬 후 균등 분할.
//   맵에 zones:[{spawnRange,monsters}] 필드가 명시돼 있으면 그것을 우선 사용.
// ══════════════════════════════════════════════
const ZONE_COUNT = 4;                    // 구역 수 (A~D)
const ZONE_KILL_THRESHOLD = 50;          // 구역 전환 처치 수 (B안: 킬 카운터 기반)
const ZONE_RESPAWN_MIN_MS = 10000;       // 전멸 후 리젠 딜레이 최소(ms)
const ZONE_RESPAWN_MAX_MS = 20000;       // 전멸 후 리젠 딜레이 최대(ms) — 10~20초 무작위
const ZONE_NAMES = ['A','B','C','D'];
const _zoneCache = {};

function getZones(mapName){
  let md=DB.maps[mapName];
  if(!md||md.safe||!md.monsters||!md.monsters.length) return null;
  if(md.zones&&md.zones.length) return md.zones; // 맵 명시 zones 우선
  if(_zoneCache[mapName]) return _zoneCache[mapName];
  // 레벨 오름차순 정렬 → 균등 분할 (몬스터 종수 < 구역 수면 구역 수 축소)
  let ids=md.monsters.slice().sort((a,b)=>
    (((DB.monsters[a]||{}).lv)||0)-(((DB.monsters[b]||{}).lv)||0));
  let zc=Math.max(1,Math.min(ZONE_COUNT,ids.length));
  let zones=[]; for(let i=0;i<zc;i++) zones.push({monsters:[]});
  ids.forEach((id,idx)=>{ zones[Math.min(zc-1,Math.floor(idx*zc/ids.length))].monsters.push(id); });
  zones.forEach(z=>{
    let lvs=z.monsters.map(id=>(((DB.monsters[id]||{}).lv)||0));
    z.spawnRange=[Math.min.apply(null,lvs),Math.max.apply(null,lvs)];
  });
  _zoneCache[mapName]=zones;
  return zones;
}

// 맵이 바뀌었으면 구역 상태 자동 리셋 (맵 이동 경로 전수 수정 불필요 — 자기치유형)
function ensureZoneState(){
  if(G._zoneMap!==G.currentMap){
    G._zoneMap=G.currentMap; G.zoneIdx=0; G.zoneKills=0; G.nextSpawnAt=0;
  }
  if(G.zoneIdx==null)G.zoneIdx=0; if(G.zoneKills==null)G.zoneKills=0;
}

// 맵 이름 옆 구역 표시용 서픽스 ("" 또는 " · 구역 B (Lv12~20)")
function getZoneSuffix(){
  ensureZoneState();
  let zones=getZones(G.currentMap);
  if(!zones||zones.length<2) return '';
  let z=zones[Math.min(G.zoneIdx,zones.length-1)];
  let r=z.spawnRange?` (Lv${z.spawnRange[0]}~${z.spawnRange[1]})`:'';
  return ` · 구역 ${ZONE_NAMES[G.zoneIdx]||G.zoneIdx+1}${r}`;
}

// [전투설정] 유효 구역 전환 킬 수 — p.options.zoneKillTh (0=자동 전환 끄기), 미설정 시 상수 폴백
function getZoneKillTh(){
  let o=G.player&&G.player.options;
  let v=(o&&o.zoneKillTh!=null)?parseInt(o.zoneKillTh):ZONE_KILL_THRESHOLD;
  return isNaN(v)?ZONE_KILL_THRESHOLD:Math.max(0,v);
}

// 처치 시 구역 킬 카운트 — threshold 도달하면 자동 전진
function addZoneKill(){
  ensureZoneState();
  let zones=getZones(G.currentMap);
  if(!zones||zones.length<2) return;
  G.zoneKills++;
  let _th=getZoneKillTh();
  if(_th>0&&G.zoneKills>=_th){
    G.zoneKills=0;
    G.zoneIdx=(G.zoneIdx+1)%zones.length;
    log(`⚡ 이 구역 몬스터가 부족합니다. 다음 구역으로 이동합니다. → <b>구역 ${ZONE_NAMES[G.zoneIdx]}</b>${getZones(G.currentMap)[G.zoneIdx].spawnRange?` (Lv${zones[G.zoneIdx].spawnRange[0]}~${zones[G.zoneIdx].spawnRange[1]})`:''}`,'warning');
    updateUI();
  }
}

// [UI-②] 구역 킬 게이지 + 리젠 카운트다운 HUD (맵 헤더)
function updateZoneHud(){
  let el=$('zone-hud'); if(!el) return;
  let p=G.player; if(!p){ el.innerHTML=''; return; }
  ensureZoneState();
  let h='';
  let zones=getZones(G.currentMap);
  if(zones&&zones.length>=2){
    let _th=getZoneKillTh(); // [전투설정] 0=자동 전환 끄기 → 게이지 숨김
    if(_th>0){
      let pct=Math.min(100,Math.round(G.zoneKills/_th*100));
      h+=`<span class="zone-chip" title="구역 전환까지 ${Math.max(0,_th-G.zoneKills)}킬">⚡ ${G.zoneKills}/${_th}<span class="zc-bar"><span class="zc-fill" style="width:${pct}%"></span></span></span>`;
    }
  }
  let wait=(G.nextSpawnAt||0)-Date.now();
  if(wait>0&&!G.battles.length){
    let pct=Math.max(0,Math.min(100,Math.round((1-wait/(G.lastRespawnDelay||ZONE_RESPAWN_MAX_MS))*100)));
    h+=`<span class="zone-chip regen" title="다음 몬스터 리젠 대기">💤 ${Math.ceil(wait/1000)}s<span class="zc-bar"><span class="zc-fill" style="width:${pct}%"></span></span></span>`;
  }
  el.innerHTML=h;
  if(!G.silentMode){ updateActionStatus(); renderSituation(); townChatTick(); } // [P1-13 2차] 리젠 카운트다운·상태 전환을 같은 0.5초 주기로 · 마을 외침
}
function startZoneHudTimer(){
  if(G._zoneHudTimer) clearInterval(G._zoneHudTimer);
  G._zoneHudTimer=setInterval(updateZoneHud,500);
}

// [2-9] 특정 구역으로 직접 이동 (지도 모달 구역 카드 클릭)
function setZone(idx){
  ensureZoneState();
  let zones=getZones(G.currentMap);
  if(!zones||idx<0||idx>=zones.length||idx===G.zoneIdx) return;
  if(G.battles.length){ log('⚠ 전투 중에는 구역을 이동할 수 없습니다. (도망 후 이동)','warning'); return; }
  G.zoneIdx=idx; G.zoneKills=0;
  let z=zones[idx];
  log(`🚶 <b>구역 ${ZONE_NAMES[idx]}</b>(으)로 이동했다.${z.spawnRange?` (Lv${z.spawnRange[0]}~${z.spawnRange[1]})`:''}`,'location');
  updateUI();
}

// 수동 구역 이동 (핫바 행동) — dir: +1 전진 / -1 후퇴
function moveZone(dir){
  ensureZoneState();
  let zones=getZones(G.currentMap);
  if(!zones||zones.length<2){ log('🚧 구역이 나뉘어 있지 않은 지역입니다.','system'); return; }
  if(G.battles.length){ log('⚠ 전투 중에는 구역을 이동할 수 없습니다. (도망 후 이동)','warning'); return; }
  G.zoneIdx=(G.zoneIdx+dir+zones.length)%zones.length;
  G.zoneKills=0;
  let z=zones[G.zoneIdx];
  log(`🚶 <b>구역 ${ZONE_NAMES[G.zoneIdx]}</b>(으)로 이동했다.${z.spawnRange?` (Lv${z.spawnRange[0]}~${z.spawnRange[1]})`:''}`,'location');
  updateUI();
}

function spawnMonsters(){
  let md=DB.maps[G.currentMap]; if(!md||md.safe){ log('몬스터가 없습니다.','system'); if(G.autoHunt)toggleHunt(); return; }
  let p = G.player;
  // 구버전은 여기서 { spawnRate:1 } 로만 덮어써 dropRate/cardRate 가 사라졌고,
  // 그러면 드롭 확률이 undefined+0 = NaN 이 되어 그 틱의 드롭이 통째로 사라졌다 (결함 K)
  ensureSettings(p);
  if (!p.seenCount) p.seenCount = {};

  let bossMode = (p.options && p.options.bossMode) || 'normal';
  const initDist = getInitialDistance(p);
  let nm = [];

  // ── 보스만사냥 모드 ──
  if(bossMode === '보스만사냥' && md.hasMvp){
    let mvpMon = DB.monsters[String(md.hasMvp)];
    if(mvpMon){
      G.battles.push(Object.assign({},mvpMon,{currentHp:mvpMon.hp,maxHp:mvpMon.hp,statusEffects:{},distance:initDist,isMvp:true}));
      nm.push(mvpMon.emoji + mvpMon.name);
      p.seenCount[mvpMon.name] = (p.seenCount[mvpMon.name]||0) + 1;
      spawnMvpSlaves(mvpMon, initDist);
      logSep();
      logMvpAppear(mvpMon);
      renderMonsters(); return;
    }
  }

  // ── 일반 몬스터 출현 (보스만사냥이 아닌 경우) ──
  if(!md.monsters || !md.monsters.length){
    // monsters 배열이 없는 맵이더라도 보스만사냥이면 위에서 처리됨
    if(bossMode !== '보스만사냥'){ log('몬스터가 없습니다.','system'); if(G.autoHunt)toggleHunt(); return; }
  }

  // 일반 스폰
  if(md.monsters && md.monsters.length){
    let sr = p.settings.spawnRate;
    let r=Math.random();
    let c=r<(0.005*sr)?5:r<(0.01*sr)?4:r<(0.025*sr)?3:r<(0.06*sr)?2:1;
    c = Math.min(5, Math.floor(c));

    // [2-9] 현재 구역의 몬스터 풀에서 스폰 (구역 없으면 기존 전체 풀)
    ensureZoneState();
    let _zones=getZones(G.currentMap);
    let _pool=(_zones&&_zones.length)?_zones[Math.min(G.zoneIdx,_zones.length-1)].monsters:md.monsters;
    if(!_pool||!_pool.length)_pool=md.monsters;

    for(let i=0;i<c;i++){
      let id=_pool[Math.floor(Math.random()*_pool.length)];
      let m=DB.monsters[id];
      if(m){
        G.battles.push(Object.assign({},m,{currentHp:m.hp,maxHp:m.hp,statusEffects:{},distance:initDist}));
        nm.push(m.emoji+m.name);
        p.seenCount[m.name] = (p.seenCount[m.name]||0) + 1;
      }
    }
  }

  // ── 일반 조우 모드: 낮은 확률로 MVP 추가 등장 ──
  if(bossMode === 'normal' && md.hasMvp && Math.random() < 0.01){
    let mvpMon = DB.monsters[String(md.hasMvp)];
    if(mvpMon){
      G.battles.push(Object.assign({},mvpMon,{currentHp:mvpMon.hp,maxHp:mvpMon.hp,statusEffects:{},distance:initDist,isMvp:true}));
      nm.push(mvpMon.emoji + mvpMon.name);
      p.seenCount[mvpMon.name] = (p.seenCount[mvpMon.name]||0) + 1;
      spawnMvpSlaves(mvpMon, initDist);
    }
  }

  if(!nm.length) return; logSep();
  let hasMvpInBattle = G.battles.some(b=>b.isMvp);
  if(hasMvpInBattle){
    let mvpB = G.battles.find(b=>b.isMvp);
    logMvpAppear(mvpB);
    let others = nm.filter(n=>!n.includes(mvpB.name));
    if(others.length) log(`⚠ 함께 나타난 <b>${others.join(', ')}</b>`,'warning');
    pbReact('mvp', mvpB.name);
  } else if(initDist > 1){
    log(`⚠ 야생의 <b>${nm.join(', ')}</b> 출현! <span style="color:var(--blue-light)">[거리 ${initDist}]</span>`,'warning');
  } else {
    log(`⚠ 야생의 <b>${nm.join(', ')}</b> 출현!`,'warning');
  }
  renderMonsters();
}

function checkMobile(){
  let isM=window.innerWidth<=700;
  // [UI-⑤] 핫바를 모바일에서는 main-area 하단 가로 스트립으로 이동 — [P1-13] 주행동 바 바로 위
  // [P1-13] 적 정보(#mon-list)는 모바일에서 로그 위 상황 카드로 이동 (전투 탭 폐지)
  let hp=$('hotbar-panel'), ma=document.getElementById('main-area'), rp=document.getElementById('right-panel');
  // [세계경험 개편 1단계] game-log가 #log-viewport로 감싸이면서, main-area의 직계 자식 기준으로
  // 삽입해야 하는 insertBefore 참조 노드도 래퍼(lv)로 옮김 — gl은 더 이상 ma의 직계 자식이 아니라
  // ma.insertBefore(ml, gl)이 NotFoundError를 던진다
  let ml=document.getElementById('mon-list'), ab=document.getElementById('action-bar'), lv=document.getElementById('log-viewport');
  if(!ma||!rp) return;
  if(isM){
    if(hp&&hp.parentElement!==ma) ma.insertBefore(hp,ab);
    if(ml&&ml.parentElement!==ma) ma.insertBefore(ml,lv);
  } else {
    if(ml&&ml.parentElement===ma) rp.appendChild(ml);
    if(hp&&hp.parentElement===ma) rp.insertBefore(hp,rp.firstChild);
  }
}
// [P1-13] 모바일 하단 탭 4개 — 로그·캐릭터(상세 공용 화면)·가방·메뉴
function mobileTab(t){
  if(t==='char'){ closeModal(); openCharDetail('stats'); return; }
  closeCharDetail();
  if(t==='bag') showInvModal();
  else if(t==='menu') showMoreMenu();
  else closeModal();
  syncMobileTab();
}
function syncMobileTab(){
  let cd=document.getElementById('char-detail');
  let cur=(cd&&cd.classList.contains('open'))?'char':'log';
  document.querySelectorAll('.mtab[data-mt]').forEach(b=>b.classList.toggle('active',b.dataset.mt===cur));
}
window.addEventListener('resize',checkMobile);
</script>
