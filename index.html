// ── 2차 전직 상호 배타 그룹 (같은 1차 직업에서 분기하는 퀘스트 묶음)
const JOB2_EXCLUSIVE_GROUPS = {
  job2_knight:     ['job2_knight', 'job2_crusader'],
  job2_crusader:   ['job2_knight', 'job2_crusader'],
  job2_wizard:     ['job2_wizard', 'job2_sage'],
  job2_sage:       ['job2_wizard', 'job2_sage'],
  job2_hunter:     ['job2_hunter', 'job2_bard', 'job2_dancer'],
  job2_bard:       ['job2_hunter', 'job2_bard', 'job2_dancer'],
  job2_dancer:     ['job2_hunter', 'job2_bard', 'job2_dancer'],
  job2_priest:     ['job2_priest', 'job2_monk'],
  job2_monk:       ['job2_priest', 'job2_monk'],
  job2_assassin:   ['job2_assassin', 'job2_rogue'],
  job2_rogue:      ['job2_assassin', 'job2_rogue'],
  job2_blacksmith: ['job2_blacksmith', 'job2_alchemist'],
  job2_alchemist:  ['job2_blacksmith', 'job2_alchemist'],
  // 전승 2차도 같은 하이 1차에서 갈라지므로 상호 배타다
  job3_lordknight:     ['job3_lordknight', 'job3_paladin'],
  job3_paladin:        ['job3_lordknight', 'job3_paladin'],
  job3_highwizard:     ['job3_highwizard', 'job3_professor'],
  job3_professor:      ['job3_highwizard', 'job3_professor'],
  job3_sniper:         ['job3_sniper', 'job3_minstrel', 'job3_gypsy'],
  job3_minstrel:       ['job3_sniper', 'job3_minstrel', 'job3_gypsy'],
  job3_gypsy:          ['job3_sniper', 'job3_minstrel', 'job3_gypsy'],
  job3_highpriest:     ['job3_highpriest', 'job3_champion'],
  job3_champion:       ['job3_highpriest', 'job3_champion'],
  job3_assassincross:  ['job3_assassincross', 'job3_stalker'],
  job3_stalker:        ['job3_assassincross', 'job3_stalker'],
  job3_whitesmith:     ['job3_whitesmith', 'job3_creator'],
  job3_creator:        ['job3_whitesmith', 'job3_creator'],
};

// 전승 2차 퀘스트의 진입 직업.
// 데이터의 reqJob 에는 '전승 이전의 2차 직업'(위저드 등)이 적혀 있는데, 이는 대사가
// 그 시절을 회상하기 때문이다. 실제로는 원작대로 '하이 1차'(마법사 하이)에서 진입한다.
// reqJob 13곳을 각각 고치는 대신 여기서 한 번에 환산한다.
const TRANS2ND_ENTRY_JOB = {
  '기사':'소드맨 하이',   '크루세이더':'소드맨 하이',
  '위저드':'마법사 하이', '세이지':'마법사 하이',
  '헌터':'궁수 하이',     '바드':'궁수 하이',     '댄서':'궁수 하이',
  '프리스트':'복사 하이', '몽크':'복사 하이',
  '어쌔신':'도둑 하이',   '로그':'도둑 하이',
  '블랙스미스':'상인 하이','알케미스트':'상인 하이'
};

// 수락한 퀘스트와 같은 배타 그룹의 나머지 퀘스트를 'failed'로 마킹
function cancelExclusiveJobQuests(acceptedId) {
  let p = G.player;
  if (!p.jobQuests) p.jobQuests = {};
  let group = JOB2_EXCLUSIVE_GROUPS[acceptedId];
  if (!group) return;
  group.forEach(otherId => {
    if (otherId === acceptedId) return;
    if (!p.jobQuests[otherId] || p.jobQuests[otherId].state === 'done') return;
    p.jobQuests[otherId] = { state: 'failed', step: 0, stepData: {} };
  });
}

// ── 전직 퀘스트 엔진
// ── 퀘스트 가용 여부 체크
function getJobQuestId(npcName, playerJob) {
  let map = NPC_JOB_QUEST_MAP[npcName];
  if (!map) return null;
  return map[playerJob] || null;
}

function getJobQuest(questId) {
  return JOB_QUESTS[questId] || JOB1_QUESTS[questId] || null;
}

// ── 전직 퀘스트 진행 상태 초기화
function initJobQuest(p, questId) {
  if (!p.jobQuests) p.jobQuests = {};
  if (!p.jobQuests[questId]) {
    p.jobQuests[questId] = { state: 'available', step: 0, stepData: {} };
  }
}

// ── NPC 전직 배지 (퀘스트 배지와 구분)
function getNpcJobBadge(npcName) {
  let p = G.player; if (!p) return '';
  let questId = getJobQuestId(npcName, p.job);
  if (!questId) return '';
  let jq = p.jobQuests && p.jobQuests[questId];
  if (!jq) return ' ❗';  // 아직 시작 안함 = 수락 가능
  if (jq.state === 'available') return ' ❗';
  if (jq.state === 'active') return ' 📋';
  if (jq.state === 'failed') return '';  // 다른 길 선택 → 배지 없음
  return '';
}

// ── 전직 퀘스트 NPC 대화 진입점
function startJobChangeDialog(npcName) {
  let p = G.player;

  // 1차 전직 체크 (JOB1_QUESTS)
  let job1Id = (NPC_JOB_QUEST_MAP[npcName] || {})[p.job];
  let job1Q  = job1Id ? JOB1_QUESTS[job1Id] : null;
  if (job1Q) {
    handleJobQuestNpc(npcName, job1Id, job1Q);
    return true;
  }

  // 2차 / 전승 2차 전직 체크
  let questId = getJobQuestId(npcName, p.job);
  if (!questId) return false;
  let q = getJobQuest(questId);
  if (!q) return false;

  handleJobQuestNpc(npcName, questId, q);
  return true;
}

function handleJobQuestNpc(npcName, questId, q) {
  let p = G.player;

  // 전직 조건 사전 체크
  // 전승 요건을 먼저 본다 — 비전승자에게 "마법사 하이가 아니다"라고 하면 길을 오해한다
  if (q.reqRebirth && !p.rebirth) {
    log(`⚠ ${npcName}: "전승을 마친 자만이 이 시험을 받을 수 있다. 발할라의 발키리를 찾아가라."`, 'warning');
    return;
  }
  // 전승 2차 퀘스트는 reqJob 이 전승 이전 직업명으로 적혀 있으므로 하이 1차로 환산한다
  let needJob = q.reqJob;
  if (needJob && q.reqRebirth && TRANS2ND_ENTRY_JOB[needJob]) needJob = TRANS2ND_ENTRY_JOB[needJob];
  if (needJob && p.job !== needJob) {
    log(`⚠ ${npcName}: "${needJob}${josa(needJob,'이가')} 아니라면 이 시험을 받을 수 없다."`, 'warning');
    return;
  }
  if (q.reqJobLv && p.jobLv < q.reqJobLv) {
    log(`⚠ ${npcName}: "Job Lv.${q.reqJobLv} 이상이어야 한다. (현재 Job Lv.${p.jobLv})"`, 'warning');
    return;
  }
  if (q.reqBaseLv && (p.baseLv || 1) < q.reqBaseLv) {
    log(`⚠ ${npcName}: "Base Lv.${q.reqBaseLv} 이상이어야 한다. (현재 Base Lv.${p.baseLv})"`, 'warning');
    return;
  }
  // 전승 자격(원작 4종) — 미충족 시 발할라 밖으로 추방
  if (q.reqRebirthEligible) {
    let _reason = checkRebirthEligibility(p);
    if (_reason) { expelFromValhalla(npcName, _reason); return; }
  }

  // 배타 그룹 체크: 같은 그룹의 다른 퀘스트가 이미 진행/완료됐으면 차단
  let _excGroup = JOB2_EXCLUSIVE_GROUPS[questId];
  if (_excGroup && p.jobQuests) {
    let _competing = _excGroup.find(oid => oid !== questId && p.jobQuests[oid] &&
      ['active','done'].includes(p.jobQuests[oid].state));
    if (_competing) {
      let _cq = getJobQuest(_competing);
      log(`⚠ ${npcName}: "그대는 이미 ${_cq ? _cq.targetJob : '다른 직업'}의 길을 선택했습니다. 두 길을 동시에 걸을 수는 없습니다."`, 'npc');
      return;
    }
  }

  // 퀘스트 상태 초기화 또는 불러오기
  initJobQuest(p, questId);
  let jq = p.jobQuests[questId];

  if (jq.state === 'done') {
    log(`${npcName}: "그대는 이미 ${q.targetJob}의 길을 걷고 있다. 자랑스럽구나."`, 'npc');
    return;
  }

  if (jq.state === 'failed') {
    let _g = JOB2_EXCLUSIVE_GROUPS[questId];
    let _chosenId = _g && _g.find(oid => oid !== questId && p.jobQuests[oid] && p.jobQuests[oid].state !== 'failed');
    let _chosenJob = _chosenId ? ((getJobQuest(_chosenId) || {}).targetJob || '다른 직업') : '다른 직업';
    log(`${npcName}: "그대는 ${_chosenJob}의 길을 선택했습니다. 이 길은 이제 그대의 것이 아닙니다."`, 'npc');
    return;
  }

  // 현재 스텝 처리
  let step = q.steps[jq.step];
  if (!step) return;

  processJobQuestStep(questId, q, jq, step);
}

// ── 스텝별 처리 분기
function processJobQuestStep(questId, q, jq, step) {
  let p = G.player;

  if (step.type === 'dialog') {
    showJobQuestDialog(questId, q, jq, step, 'main');
    return;
  }

  if (step.type === 'kill' || step.type === 'gather') {
    let cur  = jq.stepData.count || 0;
    let total = step.count;
    if (cur < total) {
      // 진행 중 안내
      let msg = (step.dialog_progress || "{target} {remain}개/마리 더 필요합니다.")
        .replace('{cur}',    cur)
        .replace('{total}',  total)
        .replace('{remain}', total - cur)
        .replace('{target}', step.target);
      log(`📋 ${q.npc}: "${msg}"`, 'quest');
      return;
    }
    // 완료 → 완료 대사 출력 후 다음 스텝으로
    advanceJobQuestStep(questId, q, jq, step);
    return;
  }

  if (step.type === 'quiz') {
    showJobQuestDialog(questId, q, jq, step, 'quiz');
    return;
  }

  if (step.type === 'reward') {
    completeJobQuest(questId, q, jq, step);
    return;
  }
}

// ── 스텝 전진 공용 함수
// 다음 스텝으로 넘기고, 그 스텝의 시작 대사가 있으면 띄운다.
function goToNextJobQuestStep(questId, q, jq) {
  jq.step++;
  jq.stepData = {};
  let nextStep = q.steps[jq.step];
  if (!nextStep) return;
  if (nextStep.dialog_start) {
    _jobDialogState = { questId, stepId: nextStep.id, branch:'start', nodeIndex:0, nodes: nextStep.dialog_start };
    renderJobDialogNode();
  } else {
    processJobQuestStep(questId, q, jq, nextStep);
  }
}

// kill/gather 스텝의 목표를 채우고 NPC에게 돌아왔을 때 호출된다.
// 완료 대사가 있으면 먼저 보여주고, 대사가 끝나면 handleJobDialogEnd 의 'stepcomplete'
// 분기에서 다음 스텝으로 넘어간다. (구 버전은 이 함수가 아예 정의돼 있지 않아
//  kill/gather 를 포함한 전직 퀘스트가 전부 ReferenceError 로 중단됐다)
function advanceJobQuestStep(questId, q, jq, step) {
  let nodes = step && step.dialog_complete;
  if (nodes && nodes.length) {
    _jobDialogState = { questId, stepId: step.id, branch:'stepcomplete', nodeIndex:0, nodes };
    renderJobDialogNode();
    return;
  }
  goToNextJobQuestStep(questId, q, jq);
}

// ── 전직 퀘스트 대화 모달
let _jobDialogState = {};

function showJobQuestDialog(questId, q, jq, step, branch) {
  let nodes;
  if (branch === 'main')  nodes = step.dialog;
  else if (branch === 'quiz') nodes = step.dialog;
  else nodes = step['dialog_' + branch];
  if (!nodes || !nodes.length) return;

  _jobDialogState = { questId, stepId: step.id, branch, nodeIndex: 0, nodes };
  renderJobDialogNode();
}

function renderJobDialogNode() {
  let { questId, stepId, branch, nodes, nodeIndex } = _jobDialogState;
  let node = nodes[nodeIndex];
  if (!node) return;

  let q  = getJobQuest(questId);
  let p  = G.player;
  let jq = p.jobQuests[questId];

  let isPlayer   = node.speaker === 'player';
  let nameLabel  = isPlayer ? (p.name || '모험가') : node.speaker;
  let bubbleStyle = isPlayer
    ? `background:#eaf4fb; border:1px solid var(--blue-light); border-radius:10px 10px 0 10px; margin-left:40px; text-align:right;`
    : `background:#fdfaf0; border:1px solid var(--border-gold); border-radius:10px 10px 10px 0; margin-right:40px;`;
  let nameStyle  = isPlayer ? `color:var(--blue-light);` : `color:var(--gold-light);`;

  let h = `<div style="display:flex; flex-direction:column; gap:10px; min-height:120px;">
    <div style="padding:12px 14px; ${bubbleStyle}">
      <div style="font-size:10px; font-weight:bold; margin-bottom:5px; ${nameStyle}">${nameLabel}</div>
      <div style="font-size:12px; line-height:1.7;">${node.text || ''}</div>
    </div>`;

  let actions = [];

  if (node.choices && node.choices.length) {
    h += `<div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;">`;
    node.choices.forEach(c => {
      h += `<div onclick="handleJobDialogChoice('${questId}','${stepId}','${c.next}')"
        style="padding:9px 14px; background:#fff; border:1px solid var(--border-gold);
               border-radius:4px; cursor:pointer; font-size:11px; color:var(--text); transition:0.15s;"
        onmouseover="this.style.background='#fdfaf0'"
        onmouseout="this.style.background='#fff'">
        ${c.label}
      </div>`;
    });
    h += `</div>`;
    actions = [{ label:'닫기', action:()=>{} }];
  } else if (node.retry) {
    actions = [
      { label:'다시 도전', cls:'ok', action:()=>{ showJobQuestDialog(questId, q, jq, q.steps[jq.step], 'quiz'); }},
      { label:'닫기', action:()=>{} }
    ];
  } else {
    let isLast = nodeIndex >= nodes.length - 1;
    if (isLast) {
      actions = [{ label:'확인', cls:'ok', close: false, action:()=>{ closeModal(); handleJobDialogEnd(questId, stepId, branch); } }];
    } else {
      actions = [{ label:'다음 ▶', cls:'ok', close: false, action:()=>{ _jobDialogState.nodeIndex++; renderJobDialogNode(); } }];
    }
  }

  h += `</div>`;
  openModal(`💬 ${nameLabel}`, h, actions);
}

function handleJobDialogChoice(questId, stepId, next) {
  let p  = G.player;
  let q  = getJobQuest(questId);
  let jq = p.jobQuests[questId];
  let step = q.steps.find(s => s.id === stepId);

  if (next === 'reject' || next === 'later') {
    closeModal();
    let rejectNodes = step && step.dialog_reject;
    if (rejectNodes) {
      _jobDialogState = { questId, stepId, branch:'reject', nodeIndex:0, nodes: rejectNodes };
      renderJobDialogNode();
    }
    return;
  }

  if (next === 'accept') {
    closeModal();
    // 현재 스텝이 intro(dialog)면 다음 스텝으로 진행
    jq.state = 'active';
    cancelExclusiveJobQuests(questId); // 같은 그룹 나머지 퀘스트 실패 처리
    goToNextJobQuestStep(questId, q, jq);
    return;
  }

  if (next === 'correct') {
    closeModal();
    let correctNodes = step && step.dialog_correct;
    _jobDialogState = { questId, stepId, branch:'correct', nodeIndex:0, nodes: correctNodes || [] };
    renderJobDialogNode();
    return;
  }

  if (next === 'wrong') {
    closeModal();
    let wrongNodes = step && step.dialog_wrong;
    _jobDialogState = { questId, stepId, branch:'wrong', nodeIndex:0, nodes: wrongNodes || [] };
    renderJobDialogNode();
    return;
  }

  // 일반 다음 노드
  _jobDialogState.nodeIndex++;
  renderJobDialogNode();
}

function handleJobDialogEnd(questId, stepId, branch) {
  let p  = G.player;
  let q  = getJobQuest(questId);
  let jq = p.jobQuests[questId];
  let step = q.steps.find(s => s.id === stepId);

  if (branch === 'correct') {
    // 퀴즈 정답 → 스텝 진행
    goToNextJobQuestStep(questId, q, jq);
    return;
  }

  if (branch === 'stepcomplete') {
    // kill/gather 완료 대사 종료 → 다음 스텝
    goToNextJobQuestStep(questId, q, jq);
    return;
  }

  if (branch === 'complete' || branch === 'reward' || stepId === 'complete') {
    completeJobQuest(questId, q, jq, step);
    return;
  }

  if (branch === 'start') {
    // start 대화 끝 → 진행 안내
    let msg = step && step.dialog_progress
      ? step.dialog_progress.replace('{cur}', 0).replace('{total}', step.count).replace('{remain}', step.count).replace('{target}', step.target)
      : `${step && step.desc || ''} 를 완료하세요.`;
    log(`📋 [퀘스트] ${q.title}: ${msg}`, 'quest');
    return;
  }

  // 일반 종료 — 다음 스텝 없으면 완료
  if (branch === 'reject') return;
}

// ── kill/gather 훅 (processTurn에서 호출)
function checkJobQuestKill(monsterName) {
  let p = G.player; if (!p || !p.jobQuests) return;
  Object.keys(p.jobQuests).forEach(qid => {
    let jq = p.jobQuests[qid]; if (jq.state !== 'active') return;
    let q  = getJobQuest(qid);  if (!q) return;
    let step = q.steps[jq.step]; if (!step) return;
    if (step.type !== 'kill' || step.target !== monsterName) return;

    jq.stepData.count = (jq.stepData.count || 0) + 1;
    let cur = jq.stepData.count, total = step.count;
    log(`📋 [${q.title}] ${step.target} 처치: ${cur}/${total}`, 'quest');

    if (cur >= total) {
      log(`✅ [${q.title}] "${step.desc}" 완료! ${q.npc}에게 돌아가세요.`, 'quest');
      notify(`퀘스트 조건 달성!`, 'gold');
      // 완료 대화가 있으면 로그만 출력 (NPC에게 돌아가야 함)
    }
  });
}

function checkJobQuestGather() {
  let p = G.player; if (!p || !p.jobQuests) return;
  Object.keys(p.jobQuests).forEach(qid => {
    let jq = p.jobQuests[qid]; if (jq.state !== 'active') return;
    let q  = getJobQuest(qid);  if (!q) return;
    let step = q.steps[jq.step]; if (!step || step.type !== 'gather') return;

    let have = p.inventory[step.target] || 0;
    let prev = jq.stepData.count || 0;
    jq.stepData.count = have;

    if (have >= step.count && prev < step.count) {
      log(`✅ [${q.title}] "${step.desc}" 완료! ${q.npc}에게 돌아가세요.`, 'quest');
      notify(`퀘스트 조건 달성!`, 'gold');
    }
  });
}

// ── 전직 퀘스트 완료 처리
function completeJobQuest(questId, q, jq, step) {
  let p = G.player;

  // 완료 대화 출력
  if (step && step.dialog && step.dialog.length) {
    _jobDialogState = { questId, stepId: step.id, branch:'reward', nodeIndex:0, nodes: step.dialog };
    // 마지막 노드 확인 버튼에서 실제 전직 처리
    openModal(`💬 ${q.npc}`,
      buildJobDialogHtml(step.dialog[0], p),
      [{ label:'전직 완료!', cls:'ok', action:()=>{
        doJobQuestFinish(questId, q, jq);
      }}]
    );
    return;
  }
  doJobQuestFinish(questId, q, jq);
}

function buildJobDialogHtml(node, p) {
  let isPlayer  = node.speaker === 'player';
  let nameLabel = isPlayer ? (p.name || '모험가') : node.speaker;
  let bubbleStyle = isPlayer
    ? `background:#eaf4fb; border:1px solid var(--blue-light); border-radius:10px 10px 0 10px; margin-left:40px;`
    : `background:#fdfaf0; border:1px solid var(--border-gold); border-radius:10px 10px 10px 0; margin-right:40px;`;
  let nameStyle = isPlayer ? `color:var(--blue-light);` : `color:var(--gold-light);`;
  return `<div style="padding:12px 14px; ${bubbleStyle}">
    <div style="font-size:10px; font-weight:bold; margin-bottom:5px; ${nameStyle}">${nameLabel}</div>
    <div style="font-size:12px; line-height:1.7;">${node.text || ''}</div>
  </div>`;
}

function doJobQuestFinish(questId, q, jq) {
  let p = G.player;
  jq.state = 'done';

  // 보상 지급
  if (q.reward.zeny)  { p.zeny += q.reward.zeny; log(`💰 전직 보상: +${q.reward.zeny}z`, 'loot'); }
  if (q.reward.items) {
    Object.keys(q.reward.items).forEach(item => {
      let cnt = q.reward.items[item];
      p.inventory[item] = (p.inventory[item] || 0) + cnt;
      log(`🎁 전직 보상: ${item} x${cnt}`, 'loot');
    });
  }

  // 전승은 일반 전직과 처리가 다르다 — doJob() 은 skillPoints·statPoints 를 덮으므로 쓰지 않는다
  if (q.reward.rebirth) {
    closeModal();
    performRebirth();
    return;
  }

  // 전직 실행. 전승자가 1차 전직하면 대응하는 '하이' 직업으로 간다
  let target = resolveJobQuestTarget(q, p);
  doJob(target);
  if (target !== q.targetJob) {
    log(`💠 전승을 거친 몸이기에 평범한 ${q.targetJob}이 아닌 <b>${target}</b>의 자격을 얻었습니다.`, 'level-up');
  }
  log(`🎊 [전직 완료] ${target}${josa(target,'이가')} 되었습니다!`, 'level-up');
  notify(`${target} 전직 완료!`, 'gold');
  updateUI();
  closeModal();
}

// 전승 여부에 따라 실제 전직 대상을 결정한다.
// 구 버전은 노비스 하이가 job1 퀘스트를 완료하면 그냥 '소드맨'이 되어
// 하이 직업 라인에서 영구히 이탈했다.
function resolveJobQuestTarget(q, p){
  if (!q.highTargetJob) return q.targetJob;
  return p.rebirth ? q.highTargetJob : q.targetJob;
}

// ══════════════════════════════════════════════════
// 전직 트리 — 어떤 조건에서 어디의 누구에게 가야 하는지 한 화면에
// ══════════════════════════════════════════════════

// 계보별 열 순서. 이 순서대로 그리면 티어1과 티어2가 같은 계열끼리 붙어
// 연결선이 교차하지 않는다 (스킬트리의 uiOrders 같은 수동 테이블이 불필요)
const JOBTREE_LINES = [
  { key:'swd', name:'소드맨계', base:'JOB_SWD', high:'JOB_HSWD' },
  { key:'mg',  name:'마법사계', base:'JOB_MG',  high:'JOB_HMG'  },
  { key:'arc', name:'궁수계',   base:'JOB_ARC', high:'JOB_HARC' },
  { key:'aco', name:'복사계',   base:'JOB_ACO', high:'JOB_HACO' },
  { key:'thf', name:'도둑계',   base:'JOB_THF', high:'JOB_HTHF' },
  { key:'mer', name:'상인계',   base:'JOB_MER', high:'JOB_HMER' }
];

// 목표 직업명(한글) → 그 직업이 되는 퀘스트. JOB1/JOB_QUESTS 를 한 색인으로 합친다.
function buildJobQuestIndex(){
  let idx = {};
  Object.keys(JOB1_QUESTS).forEach(id=>{
    let q = JOB1_QUESTS[id];
    if(q.targetJob)     idx[q.targetJob]     = {questId:id, q, viaHigh:false};
    if(q.highTargetJob) idx[q.highTargetJob] = {questId:id, q, viaHigh:true};
  });
  Object.keys(JOB_QUESTS).forEach(id=>{
    let q = JOB_QUESTS[id];
    if(q.targetJob) idx[q.targetJob] = {questId:id, q, viaHigh:false};
  });
  return idx;
}

// 이 퀘스트에 들어가려면 지금 어떤 직업이어야 하는가.
// job3 의 reqJob 은 전승 이전 직업명(위저드)이므로 반드시 하이 1차로 환산해야 한다.
function jobTreeEntryJob(ent){
  let q = ent.q;
  if(q.reward && q.reward.rebirth) return '2차 직업 13종';
  if(!q.reqJob) return ent.viaHigh ? '노비스 하이' : '노비스';
  if(q.reqRebirth && TRANS2ND_ENTRY_JOB[q.reqJob]) return TRANS2ND_ENTRY_JOB[q.reqJob];
  return q.reqJob;
}

// q.steps 를 훑어 시험 내용을 문장으로 만든다 (하드코딩 금지 — 데이터가 바뀌면 따라간다)
function jobTreeTrials(q){
  if(!q.steps) return [];
  return q.steps.map(s=>{
    if(s.type==='kill')   return `${s.target} ${s.count}마리 처치`;
    if(s.type==='gather') return `${s.target} ${s.count}개 수집`;
    if(s.type==='quiz')   return s.desc || '문답 시험';
    return null;
  }).filter(Boolean);
}

// 노드 상태 판정. 'current' 현재직업 / 'done' 지나옴 / 'closed' 다른 갈래 선택으로 닫힘
//               / 'ready' 지금 갈 수 있음 / 'short' 진입직업은 맞으나 조건 미달 / 'locked' 아직 먼 길
function jobTreeStatus(code, ent, p){
  let name = DB.jobCode[code];
  if(p.job === name) return {st:'current'};
  if(!ent) return {st:'locked', why:['전직 경로 정보 없음']};

  let jq = p.jobQuests && p.jobQuests[ent.questId];
  if(jq && jq.state === 'done'){
    // 같은 퀘스트가 1차/하이1차 둘 다를 담당하므로 실제 도달 직업과 대조한다
    if(resolveJobQuestTarget(ent.q, p) === name) return {st:'done'};
  }
  if(jq && jq.state === 'failed') return {st:'closed', why:['다른 길을 선택했습니다']};

  // 같은 배타 그룹의 다른 퀘스트를 이미 잡았으면 이 길은 닫힌다.
  // cancelExclusiveJobQuests 는 상대 엔트리가 없으면 failed 를 만들지 않으므로
  // jq 만 봐서는 알 수 없다. handleJobQuestNpc 와 같은 판정을 여기서도 한다.
  let grp = JOB2_EXCLUSIVE_GROUPS[ent.questId];
  if(grp && p.jobQuests){
    let taken = grp.find(o => o !== ent.questId && p.jobQuests[o] &&
      ['active','done'].includes(p.jobQuests[o].state));
    if(taken){
      let tj = (getJobQuest(taken) || {}).targetJob || '다른 직업';
      return {st:'closed', why:[`이미 <b>${tj}</b>의 길을 선택했습니다`]};
    }
  }

  let entry = jobTreeEntryJob(ent);
  let q = ent.q, why = [];

  // 전승은 13개 2차 직업 아무거나 + 별도 자격 체크
  if(q.reward && q.reward.rebirth){
    let reason = (typeof checkRebirthEligibility==='function') ? checkRebirthEligibility(p) : null;
    if(!reason) return {st:'ready'};
    return {st: REBIRTH_ELIGIBLE_2ND.includes(JOB_NAME2CODE[normalizeJob(p.job)]) ? 'short' : 'locked', why:[reason]};
  }

  if(p.job !== entry) return {st:'locked', why:[`${entry} 상태여야 합니다`]};

  if(q.reqRebirth && !p.rebirth)              why.push('전승을 마쳐야 합니다');
  if(q.reqBaseLv && (p.baseLv||1) < q.reqBaseLv) why.push(`Base Lv.${q.reqBaseLv} 필요 (현재 ${p.baseLv})`);
  if(q.reqJobLv  && (p.jobLv||1)  < q.reqJobLv)  why.push(`Job Lv.${q.reqJobLv} 필요 (현재 ${p.jobLv})`);
  // 노비스 → 1차 전직은 원작 규칙상 스킬 포인트를 모두 써야 한다
  if(!q.reqJob && (p.skillPoints||0) > 0)     why.push(`스킬 포인트 ${p.skillPoints}점을 모두 사용해야 합니다`);

  return why.length ? {st:'short', why} : {st:'ready'};
}

// 배경은 반투명 틴트를 CSS 변수 바탕색 위에 얹는다.
// 하드코딩 색을 쓰면 다크 모드에서 흰 박스가 그대로 남는다 (L478~577 의 인라인 스타일 패치는
// 정확한 문자열 매칭이라 여기까지 커버하지 못한다).
const _jtTint = (rgb, a) => `linear-gradient(rgba(${rgb},${a}), rgba(${rgb},${a})), var(--bg-dark)`;
const JOBTREE_STYLE = {
  current:{ bd:'var(--red-light)',  bg:_jtTint('231,76,60', .16), op:1,   tag:'▶ 현재' },
  ready:  { bd:'var(--green)',      bg:_jtTint('39,174,96', .16), op:1,   tag:'❗ 가능' },
  short:  { bd:'var(--border-gold)',bg:_jtTint('243,156,18',.13), op:1,   tag:'🔒 조건' },
  done:   { bd:'var(--blue-light)', bg:_jtTint('52,152,219',.14), op:.85, tag:'✓ 완료' },
  closed: { bd:'var(--border)',     bg:_jtTint('128,128,128',.12),op:.45, tag:'✕ 닫힘' },
  locked: { bd:'var(--border)',     bg:'var(--bg-dark)',          op:.5,  tag:'' }
};

let _jobTreeTab = 'all';
let _jobTreeSel = null;

function showJobTreeModal(){
  let p = G.player; if(!p) return;
  let idx = buildJobQuestIndex();

  // 처음 열 때는 내 계보 탭으로 (전승 후에도 계보는 prevJobCode 로 이어진다)
  if(!showJobTreeModal._init || showJobTreeModal._init !== p.job){
    let myCode = JOB_NAME2CODE[normalizeJob(p.job)] || '';
    let mine = JOBTREE_LINES.find(L=>
      jobTreeLineCodes(L).includes(myCode)) ||
      (p.prevJobCode ? JOBTREE_LINES.find(L=>L.base===p.prevJobCode) : null);
    _jobTreeTab = mine ? mine.key : 'all';
    _jobTreeSel = null;
    showJobTreeModal._init = p.job;
  }

  let tabs = [{key:'all', name:'전체'}].concat(JOBTREE_LINES);
  let h = `<div style="display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:8px; flex-wrap:wrap;">`;
  tabs.forEach(t=>{
    let on = _jobTreeTab === t.key;
    h += `<div onclick="_jobTreeTab='${t.key}'; _jobTreeSel=null; showJobTreeModal()"
      style="padding:4px 10px; cursor:pointer; font-size:11px; font-weight:bold;
             border-bottom:2px solid ${on?'var(--blue-light)':'transparent'};
             color:${on?'var(--blue-light)':'var(--text-dim)'};">${t.name}</div>`;
  });
  h += `</div>`;

  h += `<div style="font-size:10px; color:var(--text-dim); margin-bottom:8px;">
    현재 <b style="color:var(--gold-light)">${(p.rebirth?'[전승] ':'')+p.job}</b>
    · Base Lv.${p.baseLv} / Job Lv.${p.jobLv}
    ${(p.skillPoints||0)>0?` · <span style="color:var(--red-light)">미사용 스킬 포인트 ${p.skillPoints}</span>`:''}
    　—　노드를 누르면 아래에 상세가 나옵니다.
  </div>`;

  h += buildJobTreeSection('normal', '일반 직업', idx, p);
  h += buildJobTreeSection('trans',  '전승 직업 (발키리의 시련을 거친 뒤)', idx, p);

  h += `<div id="jobtree-detail" style="margin-top:10px; min-height:110px; border:1px solid var(--border-gold);
         border-radius:4px; padding:10px; background:var(--bg-dark); color:var(--text);"></div>`;

  openModal('🌳 전직 트리', h, [{label:'닫기', action:()=>{}}]);

  if(!_jobTreeSel){
    // 기본 선택: 지금 갈 수 있는 곳이 있으면 그곳, 없으면 현재 직업
    let ready = Object.keys(DB.jobCode).find(c=>jobTreeStatus(c, idx[DB.jobCode[c]], p).st==='ready');
    _jobTreeSel = ready || JOB_NAME2CODE[normalizeJob(p.job)] || 'JOB_NOV';
  }
  selectJobNode(_jobTreeSel);
  setTimeout(()=>{ drawJobTreeLines('normal'); drawJobTreeLines('trans'); }, 10);
}

// 한 계보에 속한 직업 코드 전부 (1차 + 2차 + 하이1차 + 전승2차)
function jobTreeLineCodes(L){
  let out = [L.base, L.high];
  let a = DB.jobAdvance[L.base], b = DB.jobAdvance[L.high];
  if(a && Array.isArray(a.next)) out = out.concat(a.next);
  if(b && Array.isArray(b.next)) out = out.concat(b.next);
  return out;
}

function buildJobTreeSection(kind, title, idx, p){
  let isTrans = kind === 'trans';
  let root = isTrans ? 'JOB_HNOV' : 'JOB_NOV';
  let lines = _jobTreeTab==='all' ? JOBTREE_LINES : JOBTREE_LINES.filter(L=>L.key===_jobTreeTab);

  let tier1 = [], tier2 = [];
  lines.forEach(L=>{
    let c = isTrans ? L.high : L.base;
    tier1.push(c);
    let adv = DB.jobAdvance[c];
    if(adv && Array.isArray(adv.next)) tier2 = tier2.concat(adv.next);
  });

  let h = `<div style="font-size:11px; font-weight:bold; color:var(--gold-light); margin:10px 0 4px;">${title}</div>`;
  h += `<div id="jobtree-cont-${kind}" style="background:var(--bg-deep); border:1px solid var(--border);
        border-radius:4px; padding:14px 8px; overflow:auto; max-height:250px; position:relative;
        display:flex; flex-direction:column; align-items:center; gap:38px;">`;
  h += `<svg id="jobtree-svg-${kind}" style="position:absolute; top:0; left:0; width:100%; pointer-events:none; z-index:1;"></svg>`;
  [[root], tier1, tier2].forEach(row=>{
    if(!row.length) return;
    h += `<div style="display:flex; gap:8px; justify-content:center; width:100%; position:relative; z-index:2;">`;
    row.forEach(c=>{ h += buildJobNode(c, idx, p); });
    h += `</div>`;
  });
  h += `</div>`;
  return h;
}

function buildJobNode(code, idx, p){
  let name = DB.jobCode[code] || code;
  let ent  = idx[name];
  let stt  = jobTreeStatus(code, ent, p);
  let s    = JOBTREE_STYLE[stt.st] || JOBTREE_STYLE.locked;
  let sel  = _jobTreeSel === code;
  return `<div id="jobnode-${code}" onclick="selectJobNode('${code}')"
    style="min-width:62px; border:2px solid ${s.bd}; border-radius:4px; background:${s.bg};
           opacity:${s.op}; cursor:pointer; transition:.15s; flex-shrink:0;
           ${sel?'box-shadow:0 0 0 2px var(--gold);transform:scale(1.06);':'box-shadow:0 1px 3px rgba(0,0,0,.1);'}">
    <div style="font-size:19px; text-align:center; padding:3px 0;">${DB.jobEmoji[code]||'❔'}</div>
    <div style="font-size:11px; text-align:center; padding:0 3px 2px; white-space:nowrap; color:var(--text);">${name}</div>
    ${s.tag?`<div style="font-size:11px; text-align:center; background:var(--bg-panel); color:var(--text-dim); border-radius:0 0 2px 2px;">${s.tag}</div>`:''}
  </div>`;
}

function selectJobNode(code){
  _jobTreeSel = code;
  document.querySelectorAll('[id^="jobnode-"]').forEach(el=>{
    let on = el.id === 'jobnode-'+code;
    el.style.boxShadow = on ? '0 0 0 2px var(--gold)' : '0 1px 3px rgba(0,0,0,.1)';
    el.style.transform = on ? 'scale(1.06)' : 'none';
  });
  let panel = document.getElementById('jobtree-detail');
  if(panel) panel.innerHTML = buildJobDetail(code);
}

function buildJobDetail(code){
  let p = G.player;
  let name = DB.jobCode[code] || code;
  let ent = buildJobQuestIndex()[name];
  let row = (k,v)=>`<div style="display:flex; gap:8px; margin-bottom:3px;">
      <span style="min-width:52px; color:var(--text-dim); flex-shrink:0;">${k}</span><span>${v}</span></div>`;

  if(code === 'JOB_NOV'){
    return `<div style="font-size:11px; line-height:1.7;">
      <div style="font-weight:bold; font-size:13px; color:var(--gold-light); margin-bottom:6px;">🧒 노비스 — 모든 모험의 출발점</div>
      ${row('다음','Job Lv.10을 채우고 <b>스킬 포인트를 모두 쓴 뒤</b> 각 마을의 1차 전직 NPC에게 가세요.')}
      ${row('상한','Job Lv.10')}
    </div>`;
  }
  if(!ent){
    return `<div style="font-size:11px; color:var(--text-dim);">${DB.jobEmoji[code]||''} <b>${name}</b> — 전직 경로 데이터가 없습니다.</div>`;
  }

  let q = ent.q;
  let stt = jobTreeStatus(code, ent, p);
  let s = JOBTREE_STYLE[stt.st];
  let entry = jobTreeEntryJob(ent);
  let npc = q.npc || '—';
  let where = (DB.npcs[npc] && DB.npcs[npc].map) || '—';
  let isRb = !!(q.reward && q.reward.rebirth);

  let cond = [];
  if(q.reqBaseLv) cond.push(`Base Lv.${q.reqBaseLv}`);
  if(q.reqJobLv)  cond.push(`Job Lv.${q.reqJobLv}`);
  if(q.reqRebirth) cond.push('전승 완료');
  if(!q.reqJob && !isRb) cond.push('스킬 포인트 0');

  let h = `<div style="font-size:11px; line-height:1.7;">
    <div style="font-weight:bold; font-size:13px; color:var(--gold-light); margin-bottom:6px;">
      ${DB.jobEmoji[code]||''} ${name}
      <span style="font-size:10px; font-weight:normal; color:var(--text-dim);">　${entry} → ${name}</span>
      <span style="float:right; font-size:10px; color:${s.bd};">${s.tag||'아직 이릅니다'}</span>
    </div>`;

  h += row('조건', cond.length?cond.join(' · '):'없음');

  if(stt.why && stt.why.length){
    h += `<div style="margin:5px 0; padding:6px 9px; background:rgba(231,76,60,.12); border:1px solid var(--red-light);
           border-radius:3px; color:var(--text);">
        ${stt.why.map(w=>`· ${w}`).join('<br>')}</div>`;
  }

  if(isRb){
    // 전승만 3단계 체인이라 별도로 안내한다
    h += row('경로', `① 유노 <b>현자 메테우스 실페</b>에게 ${REBIRTH_DONATION.toLocaleString()}z 후원<br>
                      ② 유노 <b>이미르의 책</b>에서 “몸을 맡긴다”<br>
                      ③ 발할라 <b>발키리</b>와 대화`);
    h += row('자격', `일반 2차 직업 · Base Lv.99 · Job Lv.50 · 스킬 포인트 0 · 탈것 해제 · 무게 ${REBIRTH_MAX_WEIGHT} 미만`);
    h += row('보상', `스탯 포인트 <b>100</b> · 최대 HP/SP 영구 <b>+25%</b> · Base/Job Lv.1로 재시작`);
    h += `<div style="margin-top:4px; font-size:10px; color:var(--red-light);">※ 자격 미달로 발키리를 만나면 발할라 밖으로 쫓겨납니다.</div>`;
  } else {
    h += row('장소', `<b>${where}</b>`);
    h += row('NPC', `<b>${npc}</b>`);
    let trials = jobTreeTrials(q);
    if(trials.length) h += row('시험', trials.join(' → '));
    if(q.reward && q.reward.zeny) h += row('보상', `${q.reward.zeny.toLocaleString()}z`);
  }

  let grp = JOB2_EXCLUSIVE_GROUPS[ent.questId];
  if(grp && grp.length > 1){
    let rivals = grp.filter(id=>id!==ent.questId)
      .map(id=>(getJobQuest(id)||{}).targetJob).filter(Boolean);
    if(rivals.length) h += row('택일', rivals.length===1
      ? `<b>${rivals[0]}</b>와(과) 택일 — 한쪽을 수락하면 다른 쪽은 닫힙니다`
      : `<b>${rivals.join(' / ')}</b> 중 하나만 — 하나를 수락하면 나머지는 닫힙니다`);
  }

  let cap = (typeof getJobLvCap==='function') ? getJobLvCap(name) : null;
  if(cap) h += row('상한', `Job Lv.${cap}`);

  return h + `</div>`;
}

// 연결선 — drawSkillLines 의 좌표 계산을 그대로 쓰되 간선 소스만 DB.jobAdvance 로 바꿨다
function drawJobTreeLines(kind){
  let cont = document.getElementById('jobtree-cont-'+kind);
  let svg  = document.getElementById('jobtree-svg-'+kind);
  if(!cont || !svg) return;
  svg.style.height = cont.scrollHeight + 'px';

  let out = '<defs><marker id="jtarrow-'+kind+'" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a4bccc"/></marker></defs>';
  let cRect = cont.getBoundingClientRect();

  const edge = (from, to)=>{
    let e1 = document.getElementById('jobnode-'+from);
    let e2 = document.getElementById('jobnode-'+to);
    if(!e1 || !e2) return;
    let r1 = e1.getBoundingClientRect(), r2 = e2.getBoundingClientRect();
    let x1 = r1.left - cRect.left + r1.width/2 + cont.scrollLeft;
    let y1 = r1.top  - cRect.top  + r1.height  + cont.scrollTop;
    let x2 = r2.left - cRect.left + r2.width/2 + cont.scrollLeft;
    let y2 = r2.top  - cRect.top              + cont.scrollTop;
    out += `<path d="M ${x1} ${y1} C ${x1} ${y1+20}, ${x2} ${y2-20}, ${x2} ${y2}" stroke="#a4bccc" stroke-width="2" fill="none" marker-end="url(#jtarrow-${kind})"/>`;
  };

  let root = kind==='trans' ? 'JOB_HNOV' : 'JOB_NOV';
  let lines = _jobTreeTab==='all' ? JOBTREE_LINES : JOBTREE_LINES.filter(L=>L.key===_jobTreeTab);
  lines.forEach(L=>{
    let c = kind==='trans' ? L.high : L.base;
    edge(root, c);                       // 노비스(하이) → 1차(하이 1차)
    let adv = DB.jobAdvance[c];
    // JOB_HNOV 의 next 는 배열이 아니라 "__PREV_HIGH__" 문자열이라 여기서 걸러진다
    if(adv && Array.isArray(adv.next)) adv.next.forEach(n=>edge(c, n));
  });
  svg.innerHTML = out;
}

// 핫바 시스템 (QWERASDFZXCV)
// ══════════════════════════════════════════════════
const HOTBAR_KEYS = ['q','w','e','r','a','s','d','f','z','x','c','v'];

const HOTBAR_ACTIONS = {
  '도망': { emoji:'🏃', desc:'전투 이탈 (쿨타임 30턴, 아이템 불필요)' },
  '구역 전진': { emoji:'⏩', desc:'다음 구역으로 이동 (전투 중 불가)' }, // [2-9]
  '구역 후퇴': { emoji:'⏪', desc:'이전 구역으로 이동 (전투 중 불가)' }  // [2-9]
};

function actionFlee(){
  if(!G.battles.length){ log(`🏃 전투 중이 아닙니다.`,'warning'); return; }
  if((G.cooldowns['__flee']||0)>0){ log(`⏳ 도망 쿨타임 중 (${G.cooldowns['__flee']}턴)`,'warning'); return; }
  G.battles=[]; G.cooldowns['__flee']=30;
  log(`🏃 <b>[도망]</b> 전투에서 이탈했다!`,'system');
  renderMonsters(); renderHotbar();
}

function executeHotbar(key){
  let p=G.player; if(!p) return;
  let slot=(p.hotbar||{})[key]; if(!slot) return;
  // [UI-③] 발동 플래시
  let _el=$('hb-slot-'+key);
  if(_el){ _el.classList.remove('used'); void _el.offsetWidth; _el.classList.add('used'); }
  if(slot.type==='skill') useSkill(slot.name);
  else if(slot.type==='item'){ useItem(slot.name); }
  else if(slot.type==='action'){
    if(slot.name==='도망') actionFlee();
    else if(slot.name==='구역 전진') moveZone(1);  // [2-9]
    else if(slot.name==='구역 후퇴') moveZone(-1); // [2-9]
  }
}

function getHotbarEmoji(slot){
  if(!slot) return '＋';
  if(slot.type==='skill') return (DB.skills[slot.name]&&DB.skills[slot.name].emoji)||'✨';
  if(slot.type==='item')  return (DB.items[slot.name]&&DB.items[slot.name].emoji)||'🎒';
  if(slot.type==='action') return HOTBAR_ACTIONS[slot.name]&&HOTBAR_ACTIONS[slot.name].emoji||'⚡';
  return '?';
}

function renderHotbar(){
  let hg=$('hotbar-grid'); if(!hg) return;
  let p=G.player; if(!p){ hg.innerHTML=''; return; }
  let hb=p.hotbar||{};
  let h='';
  HOTBAR_KEYS.forEach(k=>{
    let slot=hb[k];
    let cdTxt='';
    if(slot){
      if(slot.type==='skill'&&(G.cooldowns[slot.name]||0)>0) cdTxt=G.cooldowns[slot.name];
      if(slot.type==='action'&&slot.name==='도망'&&(G.cooldowns['__flee']||0)>0) cdTxt=G.cooldowns['__flee'];
    }
    if(slot){
      let em=getHotbarEmoji(slot);
      let nm=slot.name.length>6?slot.name.slice(0,5)+'…':slot.name;
      // [UI-③] 상태 클래스: cd=쿨다운 오버레이, nosp=SP 부족 흐림
      let stCls='';
      if(cdTxt) stCls+=' cd';
      else if(slot.type==='skill'){
        let _sk=DB.skills[slot.name];
        if(_sk){ let _slv=p.skills[slot.name]||1; let _cost=typeof _sk.spCost==='function'?_sk.spCost(_slv):_sk.spCost; if(_cost&&p.sp<_cost) stCls+=' nosp'; }
      }
      h+=`<button class="hotbar-slot${stCls}" id="hb-slot-${k}" onclick="openHotbarModal('${k}')" title="${slot.name} (${k.toUpperCase()})"><span class="hb-key">${k.toUpperCase()}</span><span class="hb-icon">${em}</span><span class="hb-name">${nm}</span>${cdTxt?`<span class="hb-cd-ov">${cdTxt}</span>`:''}</button>`;
    } else {
      h+=`<button class="hotbar-slot empty" onclick="openHotbarModal('${k}')"><span class="hb-key">${k.toUpperCase()}</span><span class="hb-icon" style="font-size:14px;color:#ccc">＋</span></button>`;
    }
  });
  hg.innerHTML=h;
}

function openHotbarModal(key){
  let p=G.player; if(!p) return;
  if(!p.hotbar) p.hotbar={};
  let cur=p.hotbar[key];
  let curInfo=cur?`<div style="margin-bottom:6px;font-size:11px;padding:4px 6px;background:var(--panel);border-radius:3px;border:1px solid var(--border)">현재 [${key.toUpperCase()}]: ${getHotbarEmoji(cur)} ${cur.name}</div>`:'';
  let clearBtn=cur?`<button class="m-btn" style="margin-top:6px" onclick="clearHotbarSlot('${key}')">🗑 슬롯 비우기</button>`:'';
  let body=`${curInfo}
<div class="inv-tabs" style="margin-bottom:6px;">
  <div class="inv-tab active" id="hb-tab-skill" onclick="switchHbTab('skill')">스킬</div>
  <div class="inv-tab" id="hb-tab-item" onclick="switchHbTab('item')">아이템</div>
  <div class="inv-tab" id="hb-tab-action" onclick="switchHbTab('action')">행동</div>
</div>
<div id="hb-content-skill" style="max-height:220px;overflow-y:auto;">${buildSkillTab(key)}</div>
<div id="hb-content-item" style="display:none;max-height:220px;overflow-y:auto;">${buildItemTab(key)}</div>
<div id="hb-content-action" style="display:none;max-height:220px;overflow-y:auto;">${buildActionTab(key)}</div>
${clearBtn}`;
  openModal(`핫바 [${key.toUpperCase()}] 등록`, body, []);
}

function switchHbTab(tab){
  ['skill','item','action'].forEach(t=>{
    let tb=$('hb-tab-'+t); if(tb) tb.classList.toggle('active',t===tab);
    let ct=$('hb-content-'+t); if(ct) ct.style.display=t===tab?'':'none';
  });
}

function buildSkillTab(key){
  let p=G.player;
  let list=Object.keys(p.skills||{}).filter(sn=>
    p.skills[sn]>0 && DB.skills[sn] && DB.skills[sn].type!=='패시브'
  );
  if(!list.length) return '<div style="color:var(--text-dim);font-size:11px;padding:10px">등록 가능한 액티브/버프 스킬 없음</div>';
  return list.map(sn=>{
    let sk=DB.skills[sn]; let slv=p.skills[sn];
    return `<div class="hb-list-row" onclick="assignHotbar('${key}','skill','${sn}')"><span>${sk.emoji||'✨'}</span><span style="flex:1">${sn} <span style="color:var(--text-dim);font-size:10px">Lv.${slv}</span></span><span style="font-size:11px;color:var(--text-dim);white-space:nowrap">${sk.type}</span></div>`;
  }).join('');
}

function buildItemTab(key){
  let p=G.player;
  let list=Object.keys(p.inventory||{}).filter(n=>
    (p.inventory[n]||0)>0 && DB.items[n] && DB.items[n].type==='소모품'
  );
  if(!list.length) return '<div style="color:var(--text-dim);font-size:11px;padding:10px">보유 중인 소모품 없음</div>';
  return list.map(n=>{
    let it=DB.items[n];
    return `<div class="hb-list-row" onclick="assignHotbar('${key}','item','${n}')"><span>${it.emoji||'🎒'}</span><span style="flex:1">${n}</span><span style="font-size:10px;color:var(--text-dim)">×${p.inventory[n]}</span></div>`;
  }).join('');
}

function buildActionTab(key){
  return Object.entries(HOTBAR_ACTIONS).map(([name,act])=>
    `<div class="hb-list-row" onclick="assignHotbar('${key}','action','${name}')"><span>${act.emoji}</span><span style="flex:1">${name}</span><span style="font-size:11px;color:var(--text-dim)">${act.desc}</span></div>`
  ).join('');
}

function assignHotbar(key,type,name){
  let p=G.player; if(!p) return;
  if(!p.hotbar) p.hotbar={};
  p.hotbar[key]={type,name};
  closeModal(); renderHotbar();
  log(`⌨ <b>[${key.toUpperCase()}]</b> → ${getHotbarEmoji({type,name})} ${name} 등록`,'system');
}

function clearHotbarSlot(key){
  let p=G.player; if(!p||!p.hotbar) return;
  delete p.hotbar[key];
  closeModal(); renderHotbar();
}

function updateStealth(){
  let p=G.player; if(!p||!G.stealthOn) return;
  const f=v=>Math.max(0,Math.floor(v)).toLocaleString();
  const set=(id,v)=>{let e=$(id); if(e)e.textContent=v;};
  set('st-hp-b',f(p.maxHp)); set('st-hp-u',f(p.maxHp-p.hp)); set('st-hp-r',f(p.hp)); set('st-hp-p',(p.hp/p.maxHp*100).toFixed(1)+'%');
  set('st-sp-b',f(p.maxSp)); set('st-sp-u',f(p.maxSp-p.sp)); set('st-sp-r',f(p.sp)); set('st-sp-p',(p.sp/p.maxSp*100).toFixed(1)+'%');
  set('st-zeny',f(p.zeny));
  let eN=DB.expTable[p.baseLv]||1;
  set('st-exp',(p.baseExp/eN*100).toFixed(1)+'%');
  set('st-sum','합계: '+f(p.zeny)+'  개수: '+(p.totalKills||0));
}

// [3-10] X 로고 클릭 → 위장 메뉴 토글
function stealthMenu(ev){
  if(ev)ev.stopPropagation();
  let m=document.getElementById('st-menu'); if(!m) return;
  m.style.display=(m.style.display==='block')?'none':'block';
}

// [3-10] 위장 메뉴 동작 — save: 조용한 저장 / pause: 자동사냥 토글 / quit: 저장 후 로비(오버레이는 유지)
function stealthMenuAction(act){
  let m=document.getElementById('st-menu'); if(m)m.style.display='none';
  if(act==='save'){ stealthSave(); }
  else if(act==='pause'){
    let was=G.autoHunt; toggleHunt();
    stealthSetLog(was?'자동 계산이 중지되었습니다':'자동 계산을 다시 시작합니다');
  }
  else if(act==='quit'){
    if(!G.player){ stealthSetLog('닫을 문서가 없습니다'); return; }
    stealthSave();
    // exitToLobby와 동일한 정리 — 단 saveGame(파일 대화상자 발생) 대신 조용한 저장 사용
    G.autoHunt=false; clearTimeout(G.huntTimer); clearTimeout(G.passerbyTimer); clearInterval(regenTimer);
    $('game-log').innerHTML=''; logResetState(); initLobby();
    stealthSetLog('통합 문서를 닫았습니다');
  }
}

function toggleStealth(){
  buildStealth();
  G.stealthOn=!G.stealthOn;
  $('stealth-overlay').style.display=G.stealthOn?'flex':'none';
  if(G.player&&G.player.options) G.player.options.workMode=G.stealthOn; // 세이브 연동 (재접속 시 유지)
  document.title=G.stealthOn?'3분기 정산집계_v2.xlsx - 스프레드시트':'룬 미드가츠 연대기';
  if(G.stealthOn){
    updateStealth();
    if(G._stTimer)clearInterval(G._stTimer);
    G._stTimer=setInterval(updateStealth,1000);
  } else if(G._stTimer){ clearInterval(G._stTimer); G._stTimer=null; }
}

function openModal(t,b,a){

// ── [ v9.10: 능력치 상세 분석 Tooltip ] ──
let currentTooltip = null;

function formatBreakdownTooltip(breakdown) {
  let html = `<div class="stat-tooltip-header">${breakdown.name}: ${breakdown.value}</div>`;

  if (breakdown.breakdown && Array.isArray(breakdown.breakdown)) {
    breakdown.breakdown.forEach(part => {
      if (part) {
        html += `<div class="stat-tooltip-section">`;
        html += `<div class="stat-tooltip-section-title">${part.type}</div>`;
        html += `<div class="stat-tooltip-line">`;
        html += `<span>${part.description || ''}</span>`;
        html += `<span class="stat-tooltip-value">${part.value}${part.unit || ''}</span>`;
        html += `</div>`;
        if (part.formula) {
          html += `<div class="stat-tooltip-formula">${part.formula}</div>`;
        }
        html += `</div>`;
      }
    });
  }

  if (breakdown.delay) {
    html += `<div class="stat-tooltip-section">`;
    html += `<div class="stat-tooltip-line">`;
    html += `<span>딜레이</span>`;
    html += `<span class="stat-tooltip-value">${breakdown.delay}ms</span>`;
    html += `</div></div>`;
  }

  return html;
}

function showStatTooltip(e) {
  // 기존 tooltip 제거
  hideStatTooltip();

  const statKey = e.currentTarget.dataset.stat;
  const stats = G.player && calcStats ? calcStats() : null;

  if (!stats || !stats.statBreakdowns || !stats.statBreakdowns[statKey]) {
    return;
  }

  const breakdown = stats.statBreakdowns[statKey];
  const tooltip = document.createElement('div');
  tooltip.className = 'stat-tooltip';
  tooltip.innerHTML = formatBreakdownTooltip(breakdown);

  document.body.appendChild(tooltip);
  currentTooltip = tooltip;

  // 위치 조정 (마우스 위치 기준, 화면 내 유지)
  const rect = e.currentTarget.getBoundingClientRect();
  let left = rect.right + 10;
  let top = rect.top;

  // 화면 오른쪽을 벗어나면 왼쪽으로 표시
  if (left + 300 > window.innerWidth) {
    left = rect.left - 310;
  }

  // 화면 아래를 벗어나면 위로 조정
  if (top + tooltip.offsetHeight > window.innerHeight) {
    top = window.innerHeight - tooltip.offsetHeight - 10;
  }

  tooltip.style.left = Math.max(5, left) + 'px';
  tooltip.style.top = Math.max(5, top) + 'px';
}

function hideStatTooltip() {
  if (currentTooltip) {
    currentTooltip.remove();
    currentTooltip = null;
  }
}

function initStatTooltips() {
  // 모든 능력치 표시 요소에 이벤트 리스너 추가
  const statElements = document.querySelectorAll('[data-stat]');
  statElements.forEach(el => {
    el.addEventListener('mouseenter', showStatTooltip);
    el.addEventListener('mouseleave', hideStatTooltip);
    // 모바일 터치 지원
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      showStatTooltip(e);
    });
    el.addEventListener('touchend', hideStatTooltip);
  });
}

// 게임 렌더링 후 tooltip 초기화
const originalRenderChar = renderChar;
renderChar = function() {
  originalRenderChar.call(this);
  setTimeout(() => initStatTooltips(), 50);
};

// ══════════════════════════════════════════════
// ── P1-08 자동 검증 게이트 (5종) ──────────────
// 콘솔에서 await runValidationGate() 호출. 구조 리팩토링(P1-08 이후) 착수 전
// 회귀 여부를 한 번에 확인하는 용도 — 게임 내 UI는 없음(devtools 콘솔 전용).
// 완료조건(DEVREF-E P1-08): 한 번 실행으로 5종 전부 통과/실패가 찍힌다.
// ══════════════════════════════════════════════
async function runValidationGate(){
  const results = [];
  const add = (gate, name, pass, detail) => results.push({gate, name, pass, detail: detail||[]});

  // ── ① 참조 무결성 ──────────────────────────
  (function gate1(){
    let badMapMonster = [];
    Object.keys(DB.maps).forEach(mapName=>{
      let md = DB.maps[mapName];
      (md.monsters||[]).forEach(id=>{ if(!DB.monsters[String(id)]) badMapMonster.push(`${mapName}→monster:${id}`); });
      if(md.hasMvp && !DB.monsters[String(md.hasMvp)]) badMapMonster.push(`${mapName}→hasMvp:${md.hasMvp}`);
    });
    add('①','map→monster 키 실존', badMapMonster.length===0, badMapMonster);

    let badDrop = [];
    Object.keys(DB.monsters).forEach(id=>{
      let m = DB.monsters[id];
      Object.keys(m.drops||{}).forEach(k=>{ if(!DB.items[k]) badDrop.push(`${m.name}(${id})→${k}`); });
    });
    add('①','monster→drop item 키 실존', badDrop.length===0, badDrop);

    let badNpcMap = [];
    Object.keys(DB.npcs||{}).forEach(name=>{
      let n = DB.npcs[name];
      if(n.map && !DB.maps[n.map]) badNpcMap.push(`${name}→map:${n.map}`);
    });
    add('①','npc→map 키 실존', badNpcMap.length===0, badNpcMap);

    let validJobCodes = new Set(Object.keys(DB.jobCode||{}));
    let badSkillJob = [];
    Object.keys(DB.skills||{}).forEach(name=>{
      let sk = DB.skills[name];
      if(sk && sk.job && !validJobCodes.has(sk.job)) badSkillJob.push(`${name}→job:${sk.job}`);
    });
    add('①','skill→job 코드 실존', badSkillJob.length===0, badSkillJob);
  })();

  // ── ② 의미 검사 ────────────────────────────
  (function gate2(){
    const MVP_HP_MIN = 40000; // 업적 boss1 기준과 동일(단일 소유는 여전히 업적 쪽 — 여기선 상수 복제 대신 재확인만)
    let badMvp = [];
    Object.keys(DB.maps).forEach(mapName=>{
      let md = DB.maps[mapName];
      if(!md.hasMvp) return;
      let mon = DB.monsters[String(md.hasMvp)];
      if(!mon) return; // ①에서 이미 잡힘
      if(mon.hp < MVP_HP_MIN){
        badMvp.push(`${mapName}→${mon.name}(hp${mon.hp})`);
      }
    });
    add('②',`hasMvp hp>=${MVP_HP_MIN}`, badMvp.length===0, badMvp);

    let noWeight = [];
    Object.keys(DB.items).forEach(name=>{
      let it = DB.items[name];
      if(it.weight === undefined || it.weight === null) noWeight.push(name);
    });
    add('②','item.weight 필드 필수', noWeight.length===0, noWeight);

    // 맵 monsters[] 일반 스폰 풀에 MVP급 고HP 몬스터가 혼입 — DEVREF-B 2026-09-12 발견분.
    // 아직 정리하지 않은 기존 이슈라 여기선 FAIL로 잡지 않고 경고성 정보로만 노출한다.
    let contaminated = [];
    Object.keys(DB.maps).forEach(mapName=>{
      let md = DB.maps[mapName];
      (md.monsters||[]).forEach(id=>{
        let mon = DB.monsters[String(id)];
        if(mon && mon.hp >= MVP_HP_MIN && String(id) !== String(md.hasMvp||'')){
          contaminated.push(`${mapName}→${mon.name}(id${id},hp${mon.hp})`);
        }
      });
    });
    add('②','monsters[] 고HP 혼입 (경고성, DEVREF-B)', true, contaminated);
  })();

  // ── ③ 직업 cap 단일 소유 ───────────────────
  await (async function gate3(){
    try{
      let src = await fetch(location.href).then(r=>r.text());
      // P0-02①에서 실제로 나왔던 버그 패턴(직업명 문자열 비교 삼항식으로 job cap 하드코딩).
      // 정규식 자체가 이 코멘트를 스스로 검사하며 자기지시적으로 매칭되지 않도록 예시 리터럴은 적지 않는다.
      // getJobLvCap() 자체는 이 모양(단일 삼항 10:70)이 아니라서 오탐하지 않는다.
      let re = /===\s*['"]노비스['"]\s*\?\s*10\s*:\s*70/g;
      let hits = src.match(re) || [];
      add('③','getJobLvCap 외 job cap 하드코딩 0건', hits.length===0, hits);
    }catch(e){
      add('③','getJobLvCap 외 job cap 하드코딩 0건 (fetch 실패)', false, [String(e)]);
    }
  })();

  // ── ④ 온라인/오프라인 동일성 ───────────────
  // 진짜 "온라인(비동기 실타이머) vs 오프라인" 비교는 자동 게이트로 못 만든다 — 이미
  // 시드 고정 PRNG + 6시나리오 + 5시드로 1회 확정 검증됐다(P0-02③④ 완료 이력, 개발일지 v9.16).
  // 이 게이트가 자동으로 반복 확인하는 건 그 전제조건 — "같은 시작상태·같은 시드로
  // runHeadlessTicks를 두 번 돌리면 완전히 같은 결과가 나오는가"(결정성) — 다. 이게 깨지면
  // (예: 어딘가 진짜 Date.now()나 가상화 안 된 전역상태가 새어들면) 시드고정 비교 자체가
  // 무의미해지므로, 그 비교의 전제를 자동으로 지킨다.
  // 처음엔 "huntTick() 맨 루프 vs runHeadlessTicks(N)"·"runHeadlessTicks(1)×N vs (N)"으로
  // 시도했는데 둘 다 거짓 FAIL이 났다(전자는 사망복구/최종정산 스캐폴딩 누락, 후자는
  // runHeadlessTicks가 매 호출마다 `realNow() - nTicks*tickMs`로 시각 기준을 다시 잡아서
  // 1틱씩 나누면 가상 시간축이 아예 달라짐 — 배치 크기에 의존하는 게 설계상 당연했다).
  // 결정성 하나만 남기는 게 이 함수의 실제 불변식이다.
  (function gate4(){
    if(!G.player){ add('④','runHeadlessTicks 결정성(같은 시드→같은 결과)', false, ['G.player 없음 — 캐릭터 로드 후 재실행']); return; }
    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
    const snapshot = () => JSON.parse(JSON.stringify(G));
    const restore = (snap) => { let fresh=JSON.parse(JSON.stringify(snap)); Object.keys(G).forEach(k=>delete G[k]); Object.assign(G, fresh); };

    const startSnap = snapshot();
    const N = 150, TICK_MS = 500;
    const origRandom = Math.random, realDateNow = Date.now;
    let diffDetail = [];
    try{
      restore(startSnap); G.autoHunt = true;
      Math.random = mulberry32(20260913);
      let summaryA = { kills:0, exp:0, jexp:0, zeny:0, items:{}, deaths:0 };
      runHeadlessTicks(N, TICK_MS, summaryA, G.currentMap);
      let stateA = snapshot();

      restore(startSnap); G.autoHunt = true;
      Math.random = mulberry32(20260913);
      let summaryB = { kills:0, exp:0, jexp:0, zeny:0, items:{}, deaths:0 };
      runHeadlessTicks(N, TICK_MS, summaryB, G.currentMap);
      let stateB = snapshot();

      let keysToCompare = ['baseExp','jobExp','baseLv','jobLv','zeny','totalKills','hp','sp'];
      keysToCompare.forEach(k=>{
        if(JSON.stringify(stateA.player[k]) !== JSON.stringify(stateB.player[k])){
          diffDetail.push(`${k}: 1회차=${JSON.stringify(stateA.player[k])} 2회차=${JSON.stringify(stateB.player[k])}`);
        }
      });
      ['kills','exp','jexp','zeny','deaths'].forEach(k=>{
        if(summaryA[k] !== summaryB[k]) diffDetail.push(`summary.${k}: 1회차=${summaryA[k]} 2회차=${summaryB[k]}`);
      });
    } finally {
      Math.random = origRandom; Date.now = realDateNow;
      restore(startSnap);
    }
    add('④', `runHeadlessTicks(N=${N}) 결정성 — 같은 시드 2회 실행 동일 결과`, diffDetail.length===0, diffDetail);
  })();

  // ── ⑤ 세이브 round-trip ────────────────────
  // P1-07 완료 후 — validateSave/migrateSave/normalizeSave 단일 경로(loadPlayerData)의
  // 멱등성을 확인한다. **두 번 다 migrateSave를 태워야** 진짜 멱등성 검증이다 — 원본(1회도
  // 안 태운 raw 상태)과 1회 통과분을 비교하면 최초 1회성 마이그레이션(statSystemV2 등)이
  // 정상 동작한 것 자체가 "다름"으로 잡혀 거짓 FAIL이 난다(2026-09-13에 실제로 겪음).
  (function gate5(){
    if(!G.player){ add('⑤','세이브 round-trip 무손실 (loadPlayerData 멱등성)', false, ['G.player 없음']); return; }
    try{
      let loaded1 = loadPlayerData(G.player);
      let loaded2 = loadPlayerData(loaded1);
      let identical = JSON.stringify(loaded1) === JSON.stringify(loaded2);
      add('⑤','세이브 round-trip 무손실 (loadPlayerData 멱등성)', identical, identical?[]:['1회 통과분과 2회 통과분이 다름 — migrateSave/normalizeSave가 멱등이 아님']);
    }catch(e){
      add('⑤','세이브 round-trip 무손실 (loadPlayerData 멱등성)', false, [String(e)]);
    }
  })();

  const allPass = results.every(r=>r.pass);
  console.log(`%c[검증 게이트] ${allPass?'전체 PASS':'FAIL 있음'}`, `color:${allPass?'green':'red'};font-weight:bold`);
  console.table(results.map(r=>({게이트:r.gate, 항목:r.name, 결과: r.pass?'PASS':'FAIL', 상세건수: r.detail.length})));
  results.forEach(r=>{ if(!r.pass && r.detail.length) console.warn(`[${r.gate}] ${r.name}:`, r.detail); });
  return results;
}
